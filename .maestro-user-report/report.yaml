appId: com.aow.monika
---
# A31: sau 25 giây chờ engine, phải thấy vùng accessibility để hiện lại Menu.
- assertVisible:
    id: "game-reveal-edge"
- tapOn:
    id: "game-reveal-edge"
    # Game render liên tục; đừng chờ ổn định quá thời gian Menu tự ẩn (3 giây).
    waitToSettleTimeoutMs: 0
- tapOn:
    text: "Menu"
    waitToSettleTimeoutMs: 0
- scrollUntilVisible:
    element: "Báo lỗi game này"
    direction: DOWN
- tapOn: "Báo lỗi game này"
- scrollUntilVisible:
    element: "Không có tiếng"
    direction: DOWN
- tapOn: "Không có tiếng"
- tapOn: "Gửi báo lỗi"
