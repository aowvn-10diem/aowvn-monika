appId: com.aow.monika
---
# A31: sau 25 giây chờ engine, Menu đã tự ẩn. Chạm vùng hiện lại theo ID khi cần.
- runFlow:
    when:
      visible:
        id: "game-reveal-edge"
    commands:
      - tapOn:
          id: "game-reveal-edge"
- tapOn: "Menu"
- scrollUntilVisible:
    element: "Báo lỗi game này"
    direction: DOWN
- tapOn: "Báo lỗi game này"
- scrollUntilVisible:
    element: "Không có tiếng"
    direction: DOWN
- tapOn: "Không có tiếng"
- tapOn: "Gửi báo lỗi"
