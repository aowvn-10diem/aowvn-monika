// LibretroDroid 0.14.0 (GPLv3, https://github.com/Swordfish90/LibretroDroid, tag 0.14.0) nhúng vào Aow Monika để thêm
// RetroAchievements (cần đọc bộ nhớ lõi, API gốc không có). Chỉ sửa chỗ có chú thích "Aow Monika:"; xem docs/LIBRETRODROID.md.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = "com.swordfish.libretrodroid"
    compileSdk 35
    ndkVersion '22.1.7171670'

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'

        externalNativeBuild {
            cmake {
                // Available arguments are inside ${SDK}/cmake/.../android.toolchain.cmake file
                arguments '-DANDROID_STL=c++_static'
                abiFilters 'arm64-v8a', 'armeabi-v7a' // Aow Monika: app chỉ phát hành cho máy ARM
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
}
