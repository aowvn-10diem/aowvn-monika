// Lớp Java của SDL 2.26.3 (zlib) cho mkxp-z (RPG Maker XP/VX/Ace), ĐỔI GÓI sang vn.aow.monika.rgss.sdl để sống chung với
// lớp org.libsdl.app của Ren'Py (SDL 2.0.20) trong một APK. Phần native (libSDL2.so) nằm trong gói tải thêm `rgss`, JNI đã đổi gói tương ứng.
// Sinh bằng engines/rgss/rename-sdl-java.py từ SDL release-2.26.3 (adf31f6). Không sửa tay. Xem engines/rgss/UPSTREAM.md.
plugins {
    id 'com.android.library'
}

android {
    namespace = "vn.aow.monika.rgss"
    compileSdk 34

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
