name: Spike Ren'Py (đóng gói lại RAPT 8.5.3)

# P0 của docs/opus/2026-10-03-nhung-renpy-rgss.md (việc V03): biết bố cục thật của private/ + assets/ + jniLibs để ráp gói `renpy8`.
# Cách làm (không cần Android SDK): chạy `launcher distribute --package android --no-archive` của SDK chính thức (cùng bước mà
# android_build làm trước khi gọi RAPT), rồi tách private/assets theo đúng `split_renpy()` của rapt/buildlib/rapt/build.py.
# Chỉ khảo sát, KHÔNG phát hành.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản Ren'Py"
        default: "8.5.3"

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }

      - name: Tải SDK + RAPT chính thức
        run: |
          set -eo pipefail
          V=${{ inputs.version }}
          for f in sdk rapt; do curl -sSfL -O "https://www.renpy.org/dl/$V/renpy-$V-$f.zip"; done
          sha256sum *.zip
          unzip -q renpy-$V-sdk.zip
          unzip -q renpy-$V-rapt.zip -d renpy-$V-sdk
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null

      - name: Cấu hình dự án the_question (android.json)
        working-directory: renpy-${{ inputs.version }}-sdk
        run: |
          cat > the_question/.android.json <<'EOT'
          {"package":"vn.aow.spike.question","name":"The Question","icon_name":"Question","version":"1.0","numeric_version":1,
           "orientation":"sensorLandscape","permissions":["VIBRATE","INTERNET"],"include_pil":false,"include_sqlite":false,
           "layout":null,"source":false,"expansion":false,"google_play_key":null,"google_play_salt":null,"store":"none",
           "update_icons":true,"update_always":true,"heap_size":"3","update_keystores":true}
          EOT

      - name: Phân phối gói android (không nén)
        working-directory: renpy-${{ inputs.version }}-sdk
        run: |
          set -o pipefail
          chmod +x renpy.sh lib/*/* 2>/dev/null || true
          xvfb-run -a ./renpy.sh launcher distribute the_question --package android --no-archive --packagedest "$PWD/../dist-out/question" 2>&1 | tee ../distribute.log | tail -30
          ls -la ../dist-out

      - name: Bố cục
        if: always()
        run: |
          {
            echo "## Bố cục phân phối Ren'Py ${{ inputs.version }} (android, không nén)"
            echo '```'
            ls -la dist-out 2>/dev/null
            D=$(find dist-out -maxdepth 2 -type d -name 'question*' | head -1); [ -z "$D" ] && D=dist-out
            echo "--- gốc ($D)"; ls -la "$D" | head -40
            echo "--- cấp 1 trong renpy/, lib/"; ls "$D/renpy" | head -40; ls "$D/lib" 2>/dev/null | head
            echo "--- lib/ tìm python"; find "$D/lib" -maxdepth 2 | head -20
            echo "--- kích thước"; du -sh "$D"/* 2>/dev/null | sort -h | tail -15
            echo "--- kích thước renpy/ + lib/ + common"; du -sh "$D/renpy" "$D/lib" "$D/renpy/common" 2>/dev/null
            echo "--- ngoài ra: jniLibs của RAPT"; ls -l renpy-${{ inputs.version }}-sdk/rapt/prototype/renpyandroid/src/main/jniLibs/*/librenpython.so
            echo "--- blocklist/keeplist của RAPT"; cat renpy-${{ inputs.version }}-sdk/rapt/blocklist.txt; cat renpy-${{ inputs.version }}-sdk/rapt/keeplist.txt
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        continue-on-error: true   # hạn mức lưu trữ Actions từng đầy: tải artifact lỗi không làm đỏ job
        if: always()
        with:
          retention-days: 3
          name: spike-renpy
          path: |
            distribute.log
          if-no-files-found: ignore
