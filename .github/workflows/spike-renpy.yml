name: Spike Ren'Py (đóng gói lại RAPT 8.5.3)

# P0 của docs/opus/2026-10-03-nhung-renpy-rgss.md: dựng APK `the_question` bằng SDK + RAPT chính thức để
# (1) biết bố cục thật của private/ + assets/ + jniLibs, (2) có nguồn lấy gói `renpy8`. Chỉ khảo sát, KHÔNG phát hành.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản Ren'Py"
        default: "8.5.3"

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Tải SDK + RAPT chính thức
        run: |
          set -eo pipefail
          V=${{ inputs.version }}
          for f in sdk rapt; do curl -sSfL -O "https://www.renpy.org/dl/$V/renpy-$V-$f.zip"; done
          ls -l *.zip; sha256sum *.zip
          unzip -q renpy-$V-sdk.zip
          unzip -q renpy-$V-rapt.zip -d renpy-$V-sdk
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb python3 >/dev/null

      - name: Cài Android SDK qua RAPT
        working-directory: renpy-${{ inputs.version }}-sdk/rapt
        run: |
          set -o pipefail
          ROOT="$PWD/.."
          ls "$ROOT/lib/py3-linux-x86_64" | head -20
          chmod +x "$ROOT"/lib/py3-linux-x86_64/* 2>/dev/null || true
          # Python riêng của SDK (có phần mở rộng renpy.pygame); chạy từ thư mục rapt vì android.py chèn 'buildlib' theo đường dẫn tương đối
          yes | PYTHONPATH="$ROOT:$ROOT/lib/py3-linux-x86_64" "$ROOT/lib/py3-linux-x86_64/python" android.py installsdk 2>&1 | tail -25

      - name: Tạo khóa tạm + cấu hình dự án the_question
        working-directory: renpy-${{ inputs.version }}-sdk
        run: |
          set -e
          keytool -genkey -keystore the_question/android.keystore -alias android -keyalg RSA -keysize 2048 -keypass android -storepass android -dname "CN=Spike" -validity 100
          cp the_question/android.keystore the_question/bundle.keystore
          cat > the_question/.android.json <<'EOT'
          {"package":"vn.aow.spike.question","name":"The Question","icon_name":"Question","version":"1.0","numeric_version":1,
           "orientation":"sensorLandscape","permissions":["VIBRATE","INTERNET"],"include_pil":false,"include_sqlite":false,
           "layout":null,"source":false,"expansion":false,"google_play_key":null,"google_play_salt":null,"store":"none",
           "update_icons":true,"update_always":true,"heap_size":"3","update_keystores":true}
          EOT

      - name: Dựng APK bằng launcher (android_build)
        working-directory: renpy-${{ inputs.version }}-sdk
        run: |
          set -o pipefail
          chmod +x renpy.sh lib/*/renpy lib/*/python* 2>/dev/null || true
          xvfb-run -a ./renpy.sh launcher android_build the_question --destination "$PWD/../out" 2>&1 | tee ../build.log | tail -60

      - name: Bố cục APK
        if: always()
        run: |
          {
            echo "## Bố cục APK Ren'Py ${{ inputs.version }}"
            echo '```'
            ls -l out 2>/dev/null
            APK=$(ls out/*.apk 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              mkdir x && cd x && unzip -q "../$APK"
              echo "--- gốc APK"; ls -l
              echo "--- lib"; find lib -type f -exec ls -l {} \; 2>/dev/null
              echo "--- assets (cấp 1-2)"; find assets -maxdepth 2 | head -60
              echo "--- private.mp3 là tar?"; file assets/private.mp3; mkdir ../priv && tar -xf assets/private.mp3 -C ../priv 2>&1 | head -3 || true
              echo "--- private/ cấp 1-2"; cd ../priv && find . -maxdepth 2 | head -80; du -sh .
              echo "--- main.py / environment"; ls -l main.py 2>/dev/null; find . -maxdepth 1 -type l -exec ls -l {} \;
            fi
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-renpy
          path: |
            build.log
            out/*.apk
          if-no-files-found: ignore
