name: Build engines (visual novel)

# Dựng engine ngoài từ mã nguồn mở, đưa lên Releases để Monika tải khi người chơi có game (không nhét vào APK).
# Bước 1: ONScripter — OnscripterYuri bản web (wasm) chạy trong WebView như Ruffle chạy Flash.
# Bước 2: 3DS — dựng Azahar và AzaharPlus (kế thừa Citra) thành LÕI LIBRETRO Android arm64 để đọc bằng LibretroDroid.
# Chạy tay: Actions → "Build engines" → Run workflow. Xong sẽ có Release "engines-onsyuri-<số lần chạy>".
on:
  workflow_dispatch:
    inputs:
      onsyuri_ref:
        description: "Nhánh hoặc tag của OnscripterYuri"
        default: "master"

permissions:
  contents: write

jobs:
  onsyuri-web:
    runs-on: ubuntu-24.04
    env:
      EMSDK_HOME: /opt/emsdk
    steps:
      - uses: actions/checkout@v4

      - name: Lấy mã nguồn OnscripterYuri
        run: |
          git clone --depth 1 --branch "${{ inputs.onsyuri_ref }}" --recurse-submodules --shallow-submodules \
            https://github.com/YuriSizuku/OnscripterYuri.git ons
          echo "ONS_COMMIT=$(git -C ons rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.EMSDK_HOME }}
          key: emsdk-onsyuri-v1

      - name: Cài emsdk + thư viện SDL
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$EMSDK_HOME"
          cd "$EMSDK_HOME"
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh
          embuilder build sdl2 sdl2_ttf sdl2_image sdl2_mixer bzip2 ogg vorbis mpg123

      - name: Dựng onsyuri (web)
        run: |
          source "$EMSDK_HOME/emsdk_env.sh"
          cd ons/script
          EMCSDK="$EMSDK_HOME" bash ./cross_web.sh

      - name: Xem kết quả build
        run: |
          ls -la ons/build_web
          {
            echo "### Kết quả build onsyuri"
            echo '```'; ls -la ons/build_web; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Đóng gói module
        run: |
          set -e
          mkdir -p pack/onsyuri
          cp ons/build_web/onsyuri.html ons/build_web/onsyuri.js ons/build_web/onsyuri.wasm pack/onsyuri/
          [ -f ons/build_web/onsyuri.data ] && cp ons/build_web/onsyuri.data pack/onsyuri/ || true
          cp ons/build_web/onsyuri_index.py pack/onsyuri/ 2>/dev/null || true
          cp ons/LICENSE pack/onsyuri/LICENSE
          cat > pack/onsyuri/SOURCE.txt <<EOT
          OnscripterYuri (GPLv2) — https://github.com/YuriSizuku/OnscripterYuri
          Commit: $ONS_COMMIT
          Dựng bằng emscripten bởi workflow build-engines của Aow Monika. Mã nguồn đầy đủ tại link trên.
          EOT
          echo "{\"engine\":\"onsyuri-web\",\"commit\":\"$ONS_COMMIT\",\"built\":\"$(date -u +%FT%TZ)\"}" > pack/onsyuri/manifest.json
          cd pack && zip -r ../onsyuri-web.zip onsyuri && cd ..
          ls -la onsyuri-web.zip

      - uses: actions/upload-artifact@v4
        with:
          name: onsyuri-web
          path: onsyuri-web.zip

      - name: Đưa lên Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "engines-onsyuri-${{ github.run_number }}" onsyuri-web.zip \
            --title "Engine ONScripter (web) #${{ github.run_number }}" \
            --notes "OnscripterYuri @ $ONS_COMMIT (GPLv2). Module tải khi người chơi có game ONScripter."

  # ---- 3DS: Azahar / AzaharPlus → lõi libretro Android (arm64) ----
  azahar-libretro:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: azahar,     repo: azahar-emu/azahar }
          - { name: azaharplus, repo: AzaharPlus/AzaharPlus }
    steps:
      - name: Lấy mã nguồn ${{ matrix.repo }}
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules -j8 https://github.com/${{ matrix.repo }}.git src
          echo "SRC_COMMIT=$(git -C src rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: Cấu hình CMake (lõi libretro, chỉ OpenGL ES — LibretroDroid chưa có Vulkan)
        run: |
          sudo apt-get update && sudo apt-get install -y ccache
          cmake -S src -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static \
            -DANDROID_ARM_NEON=true -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO=ON \
            -DENABLE_LIBRETRO=ON -DENABLE_OPENGL=ON -DENABLE_VULKAN=OFF \
            -DENABLE_TESTS=OFF -DENABLE_QT=OFF -DENABLE_SDL2=OFF -DENABLE_GDBSTUB=OFF -DENABLE_WEB_SERVICE=OFF \
            -DCITRA_WARNINGS_AS_ERRORS=OFF -DENABLE_CCACHE=ON

      - name: Biên dịch
        run: cmake --build build --target citra_libretro -j"$(nproc)"

      - name: Đóng gói
        run: |
          set -e
          SO=$(find build -name 'azahar_libretro*.so' | head -1)
          echo "Tìm thấy: $SO"; ls -la "$SO"
          mkdir -p pack
          cp "$SO" pack/${{ matrix.name }}_libretro_android.so
          "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded pack/${{ matrix.name }}_libretro_android.so
          cat > pack/SOURCE.txt <<EOT
          ${{ matrix.repo }} (GPLv2) — https://github.com/${{ matrix.repo }}
          Commit: $SRC_COMMIT
          Dựng thành lõi libretro Android arm64 bởi workflow build-engines của Aow Monika.
          EOT
          cd pack && zip ../${{ matrix.name }}_libretro_android.so.zip ${{ matrix.name }}_libretro_android.so SOURCE.txt && cd ..
          ls -la ${{ matrix.name }}_libretro_android.so.zip
          { echo "### ${{ matrix.name }}"; ls -la pack; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-libretro
          path: ${{ matrix.name }}_libretro_android.so.zip

      - name: Đưa lên Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "core-${{ matrix.name }}-${{ github.run_number }}" ${{ matrix.name }}_libretro_android.so.zip \
            --title "Lõi 3DS ${{ matrix.name }} (arm64) #${{ github.run_number }}" \
            --notes "${{ matrix.repo }} @ $SRC_COMMIT (GPLv2). Lõi libretro cho Aow Monika."
