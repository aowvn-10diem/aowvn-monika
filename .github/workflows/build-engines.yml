name: Build engines (visual novel)

# Dựng engine ngoài từ mã nguồn mở, đưa lên Releases để Monika tải khi người chơi có game (không nhét vào APK).
# Bước 1: ONScripter — OnscripterYuri bản web (wasm) chạy trong WebView như Ruffle chạy Flash.
# Bước 2: 3DS — dựng Azahar và AzaharPlus (kế thừa Citra) thành LÕI LIBRETRO Android arm64 để đọc bằng LibretroDroid.
# Chạy tay: Actions → "Build engines" → Run workflow. Xong sẽ có Release "engines-onsyuri-<số lần chạy>".
on:
  workflow_dispatch:
    inputs:
      onsyuri_ref:
        description: "Nhánh hoặc tag của OnscripterYuri"
        default: "master"
      only:
        description: "Chạy job nào"
        type: choice
        default: all
        options: [all, onsyuri, azahar]
      azahar_repo:
        description: "Kho Azahar để dựng (AzaharPlus đọc được cả ROM mã hóa)"
        default: "AzaharPlus/AzaharPlus"
      azahar_ref:
        description: "Nhánh/tag Azahar"
        default: "master"

permissions:
  contents: write

jobs:
  onsyuri-web:
    if: ${{ inputs.only == 'all' || inputs.only == 'onsyuri' }}
    runs-on: ubuntu-24.04
    env:
      EMSDK_HOME: /opt/emsdk
    steps:
      - uses: actions/checkout@v4

      - name: Lấy mã nguồn OnscripterYuri
        run: |
          git clone --depth 1 --branch "${{ inputs.onsyuri_ref }}" --recurse-submodules --shallow-submodules \
            https://github.com/YuriSizuku/OnscripterYuri.git ons
          echo "ONS_COMMIT=$(git -C ons rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.EMSDK_HOME }}
          key: emsdk-onsyuri-v1

      - name: Cài emsdk + thư viện SDL
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$EMSDK_HOME"
          cd "$EMSDK_HOME"
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh
          embuilder build sdl2 sdl2_ttf sdl2_image sdl2_mixer bzip2 ogg vorbis mpg123

      - name: Dựng onsyuri (web)
        run: |
          source "$EMSDK_HOME/emsdk_env.sh"
          cd ons/script
          EMCSDK="$EMSDK_HOME" bash ./cross_web.sh

      - name: Xem kết quả build
        run: |
          ls -la ons/build_web
          {
            echo "### Kết quả build onsyuri"
            echo '```'; ls -la ons/build_web; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Đóng gói module
        run: |
          set -e
          mkdir -p pack/onsyuri
          cp ons/build_web/onsyuri.html ons/build_web/onsyuri.js ons/build_web/onsyuri.wasm pack/onsyuri/
          [ -f ons/build_web/onsyuri.data ] && cp ons/build_web/onsyuri.data pack/onsyuri/ || true
          cp ons/build_web/onsyuri_index.py pack/onsyuri/ 2>/dev/null || true
          cp ons/LICENSE pack/onsyuri/LICENSE
          cat > pack/onsyuri/SOURCE.txt <<EOT
          OnscripterYuri (GPLv2) — https://github.com/YuriSizuku/OnscripterYuri
          Commit: $ONS_COMMIT
          Dựng bằng emscripten bởi workflow build-engines của Aow Monika. Mã nguồn đầy đủ tại link trên.
          EOT
          echo "{\"engine\":\"onsyuri-web\",\"commit\":\"$ONS_COMMIT\",\"built\":\"$(date -u +%FT%TZ)\"}" > pack/onsyuri/manifest.json
          cd pack && zip -r ../onsyuri-web.zip onsyuri && cd ..
          ls -la onsyuri-web.zip

      - uses: actions/upload-artifact@v4
        with:
          name: onsyuri-web
          path: onsyuri-web.zip

      - name: Đưa lên Releases (repo phụ công khai nếu có PACKS_TOKEN, không thì repo này)
        env:
          GH_TOKEN: ${{ secrets.PACKS_TOKEN != '' && secrets.PACKS_TOKEN || github.token }}
          GH_REPO: ${{ secrets.PACKS_TOKEN != '' && 'aowvn-10diem/aowvn-monika-packs' || github.repository }}
        run: |
          gh release create "engines-onsyuri-${{ github.run_number }}" onsyuri-web.zip \
            --title "Engine ONScripter (web) #${{ github.run_number }}" \
            --notes "OnscripterYuri @ $ONS_COMMIT (GPLv2). Module tải khi người chơi có game ONScripter."

  # ---- 3DS: dựng bản Android của Azahar/AzaharPlus bằng Gradle của họ, trích lõi native libcitra-android.so ----
  # Monika nhúng NHÚNG tầng JNI của Azahar (giao diện là của Monika) và tải thư viện native này khi người chơi có game 3DS.
  azahar-android:
    if: ${{ inputs.only == 'all' || inputs.only == 'azahar' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Lấy mã nguồn ${{ inputs.azahar_repo }}
        run: |
          git clone --depth 1 --branch "${{ inputs.azahar_ref }}" --recurse-submodules --shallow-submodules -j8 \
            https://github.com/${{ inputs.azahar_repo }}.git src
          echo "SRC_COMMIT=$(git -C src rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài NDK + CMake theo yêu cầu của Azahar
        run: |
          NDKV=$(grep -oP 'ndkVersion = "\K[^"]+' src/src/android/app/build.gradle.kts)
          echo "NDK yêu cầu: $NDKV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDKV" "cmake;3.31.6" "platforms;android-35"

      - name: Chỉ dựng arm64 (Monika dùng arm64; x86_64 chỉ tốn thời gian)
        run: |
          sed -i 's/val abiFilter = listOf("arm64-v8a", "x86_64")/val abiFilter = listOf("arm64-v8a")/' src/src/android/app/build.gradle.kts
          grep -n "abiFilter" src/src/android/app/build.gradle.kts | head -3

      - name: Cache Gradle + ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: azahar-gradle-${{ hashFiles('src/src/android/**/*.kts', 'src/src/android/gradle/wrapper/*.properties') }}
          restore-keys: azahar-gradle-

      - name: Biên dịch (Gradle assembleVanillaRelease)
        working-directory: src/src/android
        run: ./gradlew assembleVanillaRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Trích thư viện native
        run: |
          set -e
          APK=$(find src/src/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK: $APK"; ls -la "$APK"
          mkdir -p x pack
          unzip -o -q "$APK" 'lib/arm64-v8a/*' -d x
          ls -la x/lib/arm64-v8a
          # Bỏ lớp kiểm lỗi Vulkan (chỉ dành cho dev), giữ mọi thư viện còn lại.
          cp x/lib/arm64-v8a/*.so pack/
          rm -f pack/libVkLayer_*.so
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/*/ | tail -1)
          STRIP="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          READELF="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          NM="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          # Hợp đồng JNI: mọi hàm native mà thư viện xuất ra (Monika kiểm khớp với lớp Kotlin nhúng)
          "$NM" -D --defined-only pack/libcitra-android.so | awk '{print $3}' | grep '^Java_' | sort > pack/jni-symbols.txt
          wc -l pack/jni-symbols.txt
          # Phụ thuộc động (cần nạp trước theo đúng thứ tự)
          "$READELF" -d pack/libcitra-android.so | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/' > pack/needed.txt
          cat pack/needed.txt
          cat > pack/SOURCE.txt <<EOT
          ${{ inputs.azahar_repo }} (GPLv2 hoặc mới hơn) — https://github.com/${{ inputs.azahar_repo }}
          Commit: $SRC_COMMIT
          Dựng bởi workflow build-engines của Aow Monika (Gradle assembleVanillaRelease, arm64-v8a).
          EOT
          echo "{\"engine\":\"azahar\",\"repo\":\"${{ inputs.azahar_repo }}\",\"commit\":\"$SRC_COMMIT\",\"built\":\"$(date -u +%FT%TZ)\"}" > pack/manifest.json
          (cd pack && zip -r ../azahar-android-arm64.zip .)
          ls -la azahar-android-arm64.zip pack
          { echo "### azahar-android"; ls -la pack; echo '```'; cat pack/needed.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: azahar-android-arm64
          path: azahar-android-arm64.zip

      - name: Đưa lên Releases (repo phụ công khai nếu có PACKS_TOKEN, không thì repo này)
        env:
          GH_TOKEN: ${{ secrets.PACKS_TOKEN != '' && secrets.PACKS_TOKEN || github.token }}
          GH_REPO: ${{ secrets.PACKS_TOKEN != '' && 'aowvn-10diem/aowvn-monika-packs' || github.repository }}
        run: |
          gh release create "engine-azahar-${{ github.run_number }}" azahar-android-arm64.zip \
            --title "Engine 3DS (Azahar) arm64 #${{ github.run_number }}" \
            --notes "${{ inputs.azahar_repo }} @ $SRC_COMMIT (GPLv2+). Thư viện native cho Aow Monika."
