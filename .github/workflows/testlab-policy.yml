name: Test Lab budget policy (V56)
on:
  push:
    paths: [scripts/testlab-preflight.py, scripts/test-testlab-preflight.py, scripts/collect-testlab-evidence.py, scripts/test-testlab-evidence.py, scripts/select-testlab-device.py, scripts/test-testlab-device.py, .github/testlab-devices.json, .github/workflows/testlab-policy.yml]
  pull_request:
    paths: [scripts/testlab-preflight.py, scripts/test-testlab-preflight.py, scripts/collect-testlab-evidence.py, scripts/test-testlab-evidence.py, scripts/select-testlab-device.py, scripts/test-testlab-device.py, .github/testlab-devices.json, .github/workflows/testlab-policy.yml]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - run: python3 scripts/test-testlab-preflight.py && python3 scripts/test-testlab-evidence.py && python3 scripts/test-testlab-device.py
