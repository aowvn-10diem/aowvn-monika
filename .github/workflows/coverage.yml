name: Coverage

# V51: đo độ phủ test bằng Kover. Chỉ báo cáo, CHƯA chặn PR theo ngưỡng.
# Hiện chỉ :app có test đơn vị; các module khác chưa có src/test nên chưa có số.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with: {cache-provider: basic}
      - name: Cài NDK cho J2ME Loader
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" "cmake;3.22.1" > /dev/null
      - name: Chạy test + báo cáo Kover
        run: ./gradlew koverXmlReportDebug koverHtmlReportDebug --console=plain
      - name: In % độ phủ
        run: |
          xml=$(find app/build/reports/kover -name '*.xml' | head -1)
          test -n "$xml" || { echo "::error::Không thấy báo cáo Kover XML"; exit 1; }
          python3 scripts/kover-summary.py "$xml" | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: kover-report
          path: app/build/reports/kover/
          retention-days: 7
