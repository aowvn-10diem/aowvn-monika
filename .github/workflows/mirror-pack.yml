name: Mirror pack (chép gói engine sang repo phụ công khai)

# Repo Monika là private nên app không tải được asset của Releases ở đây. Workflow này chép 1 asset từ Release của repo này
# sang repo phụ CÔNG KHAI aowvn-monika-packs (cần secret PACKS_TOKEN: Contents read+write vào repo phụ), rồi kiểm link tải thẳng
# không cần đăng nhập và in SHA-256. Chạy tay: Actions → "Mirror pack".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag Release ở repo này (vd. engine-azahar-12); để trống = engine-azahar-* mới nhất"
        default: ""
      asset:
        description: "Tên file asset"
        default: "azahar-android-arm64.zip"

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'aowvn-10diem/aowvn-monika' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      PACKS_REPO: aowvn-10diem/aowvn-monika-packs
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_ASSET: ${{ inputs.asset }}
      GH_REPO_SELF: ${{ github.repository }}
    steps:
      - name: Kiểm secret và đầu vào
        env:
          T: ${{ secrets.PACKS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$T" ]; then echo "::error::Thiếu secret PACKS_TOKEN (Contents: read+write vào $PACKS_REPO)."; exit 1; fi
          [[ "$INPUT_ASSET" =~ ^[A-Za-z0-9._-]+$ ]] && [[ "$INPUT_ASSET" != .* ]] || { echo "::error::Tên asset không hợp lệ"; exit 1; }
          if [ -n "$INPUT_TAG" ]; then
            [[ "$INPUT_TAG" =~ ^[A-Za-z0-9._-]+$ ]] && [[ "$INPUT_TAG" != -* ]] || { echo "::error::Tag không hợp lệ"; exit 1; }
          fi

      - name: Lấy asset từ repo này
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then tag=$(gh release list --repo "$GH_REPO_SELF" --limit 50 --json tagName --jq '[.[]|select(.tagName|startswith("engine-azahar-"))][0].tagName'); fi
          [ -n "$tag" ] && [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Không tìm thấy Release engine-azahar-*"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" --repo "$GH_REPO_SELF" --pattern "$INPUT_ASSET" --output asset.bin
          ls -la asset.bin
          sha256sum asset.bin | tee asset.sha256

      - name: Đưa sang repo phụ
        env:
          GH_TOKEN: ${{ secrets.PACKS_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(cut -d' ' -f1 asset.sha256)
          cp -- asset.bin "$INPUT_ASSET"
          if gh release view "$TAG" --repo "$PACKS_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$INPUT_ASSET" --repo "$PACKS_REPO" --clobber
          else
            gh release create "$TAG" "$INPUT_ASSET" --repo "$PACKS_REPO" --title "$TAG" \
              --notes "Gói engine cho Aow Monika. SHA-256: $sha. Mã nguồn: xem manifest.json trong gói (repo + commit)."
          fi

      - name: Kiểm tải thẳng không cần đăng nhập
        run: |
          set -euo pipefail
          url="https://github.com/$PACKS_REPO/releases/download/$TAG/$INPUT_ASSET"
          code=$(curl -sSL -o dl.bin -w '%{http_code}' "$url")
          echo "HTTP $code — $url"
          [ "$code" = 200 ] || { echo "::error::Link không tải được công khai (repo phụ có Public không?)"; exit 1; }
          a=$(sha256sum dl.bin | cut -d' ' -f1); b=$(cut -d' ' -f1 asset.sha256)
          [ "$a" = "$b" ] || { echo "::error::SHA-256 không khớp"; exit 1; }
          { echo "### Link công khai"; echo "$url"; echo; echo "SHA-256: $b"; echo "TAG: $TAG"; } | tee -a "$GITHUB_STEP_SUMMARY"
