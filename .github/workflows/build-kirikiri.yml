name: Build Kirikiri (Kirikiroid2Yuri)

# Thử dựng lại Kirikiroid2Yuri từ mã nguồn (cocos2d-x + Kirikiri Z). Nguồn: https://github.com/YuriSizuku/Kirikiroid2Yuri
# Cách làm theo CI của chính dự án đó: tải thư viện dựng sẵn (thirdparty_*), lấy assets từ APK 1.3.9, rồi gradle build.
# Chạy tay: Actions → "Build Kirikiri" → Run workflow. Kết quả là artifact APK (chưa phát hành cho người dùng).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Nhánh/tag/commit của Kirikiroid2Yuri (HEAD = nhánh mặc định)"
        default: "HEAD"
      variant:
        description: "Kiểu dựng"
        type: choice
        default: release
        options: [debug, release]
      publish:
        description: "Đưa APK lên Releases (repo packs công khai nếu có PACKS_TOKEN, không thì repo này)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: self

      - name: Lấy mã nguồn Kirikiroid2Yuri
        run: |
          git clone --depth 1 https://github.com/YuriSizuku/Kirikiroid2Yuri.git src
          cd src
          if [ "${{ inputs.ref }}" != HEAD ]; then git fetch --depth 1 origin "${{ inputs.ref }}" && git checkout FETCH_HEAD; fi
          git log -1 --format='%h %ad %s'
          # Bản vá của Aow Monika (kirikiri/patches): mở thẳng game từ Intent, đổi applicationId để không đụng bản gốc
          for p in ../self/kirikiri/patches/*.patch; do echo "áp $p"; git apply --verbose "$p"; done
          sed -i 's|applicationId "com.yuri.kirikiri2"|applicationId "vn.aow.monika.kirikiri"|' project/android/app/build.gradle
          grep -n applicationId project/android/app/build.gradle
          echo "SRC_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            11

      - name: Cài NDK 25.2.9519653 + cmake 3.22.1
        run: |
          set -o pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"   # sdkmanager mới cần Java 17; gradle sau đó dùng Java 11
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;33.0.2" "platforms;android-33" | tail -3

      - name: Thư viện dựng sẵn (thirdparty) + assets từ APK 1.3.9
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          R=YuriSizuku/Kirikiroid2Yuri
          echo "== Asset của release deps =="; gh release view deps --repo $R --json assets --jq '.assets[] | "\(.name)  \(.size)"'
          gh release download deps --repo $R --pattern 'thirdparty_*.tar.gz'
          for f in thirdparty_*.tar.gz; do echo "giải nén $f"; tar xzf "$f" 2>/dev/null; done
          gh release download 1.3.9_yuri --repo $R --pattern 'Kirikiroid2_yuri_1.3.9.apk'
          7z x -y Kirikiroid2_yuri_1.3.9.apk assets >/dev/null
          ls thirdparty thirdparty/build thirdparty/port 2>&1 | head -30
          du -sh thirdparty assets

      - name: Khóa ký tạm (chỉ để ký thử)
        working-directory: src/project/android/app
        run: |
          rm -f sign.jks sign.properties   # repo có sẵn khóa của tác giả, không dùng
          keytool -genkeypair -keystore sign.jks -alias tmp -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass tmppass1 -keypass tmppass1 -dname "CN=tmp"
          printf 'SIGN_KEY_ALIAS=tmp\nSIGN_KEY_PASS=tmppass1\nSIGN_STORE_PASS=tmppass1\n' > sign.properties

      - name: Gradle build
        working-directory: src/project/android
        run: |
          set -eo pipefail
          sudo mkdir -p /build_android && sudo chmod 777 /build_android
          chmod +x ./gradlew
          T=$([ "${{ inputs.variant }}" = release ] && echo assembleRelease || echo assembleDebug)
          ./gradlew $T --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log | tail -150

      - name: Kết quả
        if: always()
        run: |
          mkdir -p out && cp /tmp/gradle.log out/ 2>/dev/null || true
          find "$GITHUB_WORKSPACE" / -xdev -name '*.apk' -newer /tmp/gradle.log -o -xdev -name '*.apk' -mmin -30 2>/dev/null | grep -v Kirikiroid2_yuri_1.3.9 | sort -u | tee /tmp/apks.txt
          while read -r f; do cp "$f" out/; done < /tmp/apks.txt
          for a in out/*.apk; do [ -f "$a" ] && { echo "== $a"; unzip -l "$a" | grep -E '\.so|classes.*dex|AndroidManifest' ; } ; done || true
          {
            echo "### Kirikiroid2Yuri @ $SRC_COMMIT"
            echo '```'; ls -la out; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirikiroid2-yuri
          path: out/

      - name: Xuất đầu vào để nhúng sâu vào Monika (nguồn Java, thư viện native, assets)
        run: |
          set -e
          mkdir -p embed/java embed/lib
          C=src/thirdparty/port/cocos2d-x/cocos/platform/android
          ls "$C" | head -20
          cp -r "$C/java" embed/java/cocos2dx-java || true
          cp -r "$C/libcocos2dx" embed/java/cocos2dx-lib || true
          cp -r src/project/android/app/java embed/java/kr2-java
          cp -r src/project/android/app/res embed/java/kr2-res
          cp src/project/android/app/AndroidManifest.xml embed/java/kr2-AndroidManifest.xml
          SO=$(find "$GITHUB_WORKSPACE/src" -name 'libkrkr2yuri.so' -path '*build_android*' -path '*stripped*' 2>/dev/null | head -1)
          [ -z "$SO" ] && SO=$(find "$GITHUB_WORKSPACE/src" -name 'libkrkr2yuri.so' -path '*build_android*' 2>/dev/null | head -1)
          echo "SO=$SO"; ls -la "$SO"
          cp "$SO" embed/lib/libkrkr2yuri.so
          "$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded embed/lib/libkrkr2yuri.so || true
          ls -la embed/lib
          "$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d embed/lib/libkrkr2yuri.so | grep -E 'NEEDED|SONAME' | tee embed/lib/needed.txt
          cp -r src/assets embed/assets
          du -sh embed/*
          (cd embed && tar czf ../kirikiri-embed-inputs.tgz .)
          ls -la kirikiri-embed-inputs.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: kirikiri-embed-inputs
          path: kirikiri-embed-inputs.tgz

      - name: Đóng gói module nhúng (lib native + tài nguyên; Java nằm trong APK Monika)
        run: |
          set -e
          rm -rf pack && mkdir -p pack
          cp embed/lib/libkrkr2yuri.so pack/
          cp -r embed/assets pack/assets
          cp -r self/kirikiri/overlay/assets/. pack/assets/   # bản dịch tiếng Việt (locale/vi_vn.xml)
          cp src/LICENSE pack/LICENSE-Kirikiroid2Yuri.txt
          cat > pack/SOURCE.txt <<EOT
          Kirikiroid2Yuri — https://github.com/YuriSizuku/Kirikiroid2Yuri (giấy phép kiểu BSD sửa đổi, xem LICENSE đi kèm)
          Commit: $SRC_COMMIT
          Bản vá của Aow Monika (nhận đường dẫn game, quyền Truy cập mọi tệp, tài nguyên từ gói tải thêm): thư mục kirikiri/patches trong kho Aow Monika.
          EOT
          echo "{\"engine\":\"kirikiroid2-yuri\",\"commit\":\"$SRC_COMMIT\",\"abi\":\"arm64-v8a\",\"built\":\"$(date -u +%FT%TZ)\"}" > pack/manifest.json
          (cd pack && zip -9 -r ../kirikiri-arm64.zip .)
          sha256sum kirikiri-arm64.zip | tee kirikiri-arm64.zip.sha256
          stat -c 'size=%s' kirikiri-arm64.zip
          {
            echo "### Module Kirikiri (nhúng)"
            echo '```'; cat kirikiri-arm64.zip.sha256; stat -c 'size=%s' kirikiri-arm64.zip; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: kirikiri-module
          path: |
            kirikiri-arm64.zip
            kirikiri-arm64.zip.sha256

      - name: Đưa lên Releases
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.PACKS_TOKEN != '' && secrets.PACKS_TOKEN || github.token }}
          GH_REPO: ${{ secrets.PACKS_TOKEN != '' && 'aowvn-10diem/aowvn-monika-packs' || github.repository }}
        run: |
          gh release create "engines-kirikiri-${{ github.run_number }}" kirikiri-arm64.zip kirikiri-arm64.zip.sha256 \
            --title "Kirikiri (Kirikiroid2Yuri) #${{ github.run_number }}" \
            --notes "Dựng lại từ mã nguồn Kirikiroid2Yuri @ $SRC_COMMIT + bản vá Aow Monika. Monika tự tải khi người chơi có game Kirikiri."
