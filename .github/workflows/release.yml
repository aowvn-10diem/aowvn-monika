name: Release

# Phát hành: tạo tag dạng v0.2.0 rồi push → workflow build APK đã ký và đăng lên GitHub Releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sha:
        description: "V66: full SHA trên main, workflow tạo tag v<versionName> mới; CHỈ PM kích hoạt"
        required: false
      prerelease:
        description: "Bản thử mặc định; bản ổn định chỉ khi PM đủ cổng"
        type: boolean
        default: true
      tag:
        description: "Tên bản phát hành (tag phải tồn tại; bỏ trống khi dry_run=true)"
        required: false
      dry_run:
        description: "Chỉ kiểm ký trên main; không tạo release, tag hay upload APK"
        type: boolean
        default: false
      stable:
        description: "true = bản chính thức (CHỈ sau khi có kết quả máy thật); mặc định là prerelease"
        required: false
        default: "false"

permissions:
  contents: read
  actions: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      tag: ${{ steps.guard.outputs.tag }}
      create: ${{ steps.guard.outputs.create }}
      prerelease: ${{ steps.guard.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Fetch main for ancestor gate
        run: git fetch origin refs/heads/main:refs/remotes/origin/main --tags
      - name: Read-only exact SHA/CI/tag gate (V66)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REQUESTED_SHA: ${{ inputs.sha }}
          REQUESTED_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
          STABLE: ${{ inputs.stable }}
        run: python3 scripts/release-preflight.py
  create_tag:
    needs: preflight
    permissions: {contents: write}
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      SELECTED_SHA: ${{ needs.preflight.outputs.sha }}
    steps:
      - name: Kiểm cấu hình ký trước khi tạo tag (V30)
        id: before_tag_signing_guard
        env:
          KEYSTORE_BASE64: ${{ secrets.MONIKA_KEYSTORE_BASE64 }}
          MONIKA_KEYSTORE_PASSWORD: ${{ secrets.MONIKA_KEYSTORE_PASSWORD }}
          MONIKA_KEY_ALIAS: ${{ secrets.MONIKA_KEY_ALIAS }}
          MONIKA_KEY_PASSWORD: ${{ secrets.MONIKA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 MONIKA_KEYSTORE_PASSWORD MONIKA_KEY_ALIAS MONIKA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "::error::Thiếu cấu hình ký: $name"; exit 1; fi
          done
      - name: Tạo tag mới đúng SHA, không ghi đè/xóa (V66)
        if: needs.preflight.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = 'repos/' + os.environ['GITHUB_REPOSITORY']
          payload = json.dumps({'ref': 'refs/tags/' + os.environ['TAG'], 'sha': os.environ['SELECTED_SHA']})
          # create-ref rejects existing refs atomically. Never update-ref(force), delete or git push.
          subprocess.run(['gh', 'api', '--method', 'POST', repo + '/git/refs', '--input', '-'],
                         input=payload, text=True, check=True, stdout=subprocess.DEVNULL)
          PY
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Kiểm điều kiện ký và tag (V30)
        id: release_guard
        env:
          KEYSTORE_BASE64: ${{ secrets.MONIKA_KEYSTORE_BASE64 }}
          MONIKA_KEYSTORE_PASSWORD: ${{ secrets.MONIKA_KEYSTORE_PASSWORD }}
          MONIKA_KEY_ALIAS: ${{ secrets.MONIKA_KEY_ALIAS }}
          MONIKA_KEY_PASSWORD: ${{ secrets.MONIKA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::Tên tag không hợp lệ"; exit 1; }
          for name in KEYSTORE_BASE64 MONIKA_KEYSTORE_PASSWORD MONIKA_KEY_ALIAS MONIKA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "::error::Thiếu cấu hình ký: $name"; exit 1; fi
          done
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")" || { echo "::error::Checkout không đúng tag"; exit 1; }
          test "$(git rev-parse HEAD)" = "$SELECTED_SHA" || { echo "::error::Tag đã đổi so với SHA qua cửa chặn CI"; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Cài NDK cho J2ME Loader
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" "cmake;3.22.1" > /dev/null
      - name: Giải mã khóa ký
        env:
          KEYSTORE_BASE64: ${{ secrets.MONIKA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Thiếu cấu hình ký"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/monika.jks"
          echo "MONIKA_KEYSTORE=$RUNNER_TEMP/monika.jks" >> "$GITHUB_ENV"
      - name: Build APK release
        env:
          MONIKA_KEYSTORE_PASSWORD: ${{ secrets.MONIKA_KEYSTORE_PASSWORD }}
          MONIKA_KEY_ALIAS: ${{ secrets.MONIKA_KEY_ALIAS }}
          MONIKA_KEY_PASSWORD: ${{ secrets.MONIKA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "$MONIKA_KEYSTORE" || { echo "::error::Không có tệp ký hợp lệ"; exit 1; }
          ./gradlew testDebugUnitTest assembleRelease --console=plain
          # Chặn lỗi sập v0.4.5: thư viện đóng kèm bản sao lớp Android bị R8 đổi tên → không cho phát hành.
          python3 scripts/check-r8-mapping.py app/build/outputs/mapping/release/mapping.txt
          # Chỉ phát hành 1 APK chung cho mọi máy: app-universal-release.apk → AowVN-Monika-v0.4.5.apk
          cp app/build/outputs/apk/release/app-universal-release.apk "AowVN-Monika-${TAG}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "mapping-${TAG}.txt"
          # CHỈ phát hành bản chung (quyết định của sếp 02/10/2026): người dùng không phải chọn bản. Đừng thêm APK arm64/armv7 vào Release.
          ls -l AowVN-Monika-*.apk
      - name: Chặn APK ký debug và ghi SHA-256 (V30)
        id: apk_guard
        run: |
          set -euo pipefail
          APK="AowVN-Monika-${TAG}.apk"
          MAPPING="mapping-${TAG}.txt"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "::error::Thiếu apksigner"; exit 1; }
          # Lỗi thì in thông tin chứng thư (công khai, không có bí mật) ra log để biết nguyên nhân.
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/release-cert.txt" 2>&1 || { echo "::error::apksigner verify lỗi"; cat "$RUNNER_TEMP/release-cert.txt"; exit 1; }
          if grep -Eiq 'CN[[:space:]]*=[[:space:]]*Android Debug' "$RUNNER_TEMP/release-cert.txt"; then
            echo "::error::APK ký debug bị chặn"; exit 1
          fi
          python3 scripts/verify-apk-cert.py "$APK" || { echo "::error::Không đọc được chứng chỉ APK hoặc SHA-256 chứng thư sai"; cat "$RUNNER_TEMP/release-cert.txt"; exit 1; }
          test -s "$APK" && test -s "$MAPPING"
          sha256sum "$APK" "$MAPPING" > "SHA256SUMS-${TAG}.txt"
          { echo 'SHA-256 (APK và mapping):'; echo '```text'; cat "SHA256SUMS-${TAG}.txt"; echo '```'; } > "release-notes-${TAG}.md"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AowVN-Monika-*.apk
            mapping-${{ env.TAG }}.txt
            SHA256SUMS-${{ env.TAG }}.txt
          tag_name: ${{ env.TAG }}
          body_path: release-notes-${{ env.TAG }}.md
          generate_release_notes: true
          # Luật V31: bản chưa có kết quả thử trên máy thật luôn là prerelease.
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
      - name: Up APK lên Pixeldrain (nếu có secret PIXELDRAIN_API_KEY)
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          if [ -z "$PIXELDRAIN_API_KEY" ]; then echo "Bỏ qua: chưa có secret PIXELDRAIN_API_KEY"; exit 0; fi
          for f in AowVN-Monika-*.apk; do echo "== $f ($(stat -c%s "$f") byte)"; scripts/pixeldrain-upload.sh "$f"; done

  signing_dry_run:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
    permissions: {contents: read}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Chỉ kiểm ký tại commit main đã chọn (V43)
        id: dry_guard
        env:
          DISPATCH_EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ "$DISPATCH_EVENT" = workflow_dispatch ]
          [ "$DISPATCH_REF" = refs/heads/main ] || { echo "::error::Dry-run chỉ được chạy trên main"; exit 1; }
          [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$DISPATCH_SHA" ] || { echo "::error::Checkout không đúng commit main"; exit 1; }
      - name: Kiểm đủ cấu hình ký, không in giá trị (V30)
        id: dry_signing_guard
        env:
          KEYSTORE_BASE64: ${{ secrets.MONIKA_KEYSTORE_BASE64 }}
          MONIKA_KEYSTORE_PASSWORD: ${{ secrets.MONIKA_KEYSTORE_PASSWORD }}
          MONIKA_KEY_ALIAS: ${{ secrets.MONIKA_KEY_ALIAS }}
          MONIKA_KEY_PASSWORD: ${{ secrets.MONIKA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 MONIKA_KEYSTORE_PASSWORD MONIKA_KEY_ALIAS MONIKA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "::error::Thiếu cấu hình ký: $name"; exit 1; fi
          done
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v6
      - name: Cài NDK cho J2ME Loader
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" "cmake;3.22.1" > /dev/null
      - name: Dựng và kiểm APK đã ký, chỉ giữ trong runner
        env:
          KEYSTORE_BASE64: ${{ secrets.MONIKA_KEYSTORE_BASE64 }}
          MONIKA_KEYSTORE_PASSWORD: ${{ secrets.MONIKA_KEYSTORE_PASSWORD }}
          MONIKA_KEY_ALIAS: ${{ secrets.MONIKA_KEY_ALIAS }}
          MONIKA_KEY_PASSWORD: ${{ secrets.MONIKA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export MONIKA_KEYSTORE="$RUNNER_TEMP/monika-dry-run.jks"
          trap 'rm -f "$MONIKA_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$MONIKA_KEYSTORE"
          test -s "$MONIKA_KEYSTORE"
          ./gradlew testDebugUnitTest assembleRelease --console=plain
          python3 scripts/check-r8-mapping.py app/build/outputs/mapping/release/mapping.txt
          APK=app/build/outputs/apk/release/app-universal-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/dry-run-cert.txt"
          if grep -Eiq 'CN[[:space:]]*=[[:space:]]*Android Debug' "$RUNNER_TEMP/dry-run-cert.txt"; then
            echo "::error::APK ký debug bị chặn"; exit 1
          fi
          python3 scripts/verify-apk-cert.py "$APK"
          sha256sum "$APK"
      - name: Link engine 3DS công khai phải trả HTTP 200
        run: |
          set -euo pipefail
          URL=$(python3 -c 'import json; print(json.load(open("config/monika-config.json"))["modules"]["azahar"]["url"])')
          [[ "$URL" == https://github.com/aowvn-10diem/aowvn-monika-packs/releases/download/engine-azahar-1/* ]]
          CODE=$(curl --disable --silent --show-error --head --location --max-time 60 --output /dev/null --write-out '%{http_code}' "$URL")
          echo "Engine 3DS HTTP cuối: $CODE"
          [ "$CODE" = 200 ]
