name: Release

# Phát hành: tạo tag dạng v0.2.0 rồi push → workflow build APK đã ký và đăng lên GitHub Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Cài NDK cho J2ME Loader
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" > /dev/null
      - name: Đóng sẵn engine 3DS (Azahar) vào APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Repo private nên app không tải được asset của Releases → đóng thẳng gói engine mới nhất vào APK (assets/engines/azahar.zip).
          tag=$(gh release list --limit 50 --json tagName --jq '[.[]|select(.tagName|startswith("engine-azahar-"))][0].tagName')
          if [ -z "$tag" ]; then echo "Chưa có engine-azahar-* → APK dùng lõi Citra libretro."; exit 0; fi
          mkdir -p app/src/main/assets/engines
          gh release download "$tag" --pattern azahar-android-arm64.zip --output app/src/main/assets/engines/azahar.zip
          ls -la app/src/main/assets/engines
      - name: Giải mã khóa ký
        env:
          KEYSTORE_BASE64: ${{ secrets.MONIKA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Thiếu secret MONIKA_KEYSTORE_BASE64 (xem docs/CAP-NHAT.md)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/monika.jks"
          echo "MONIKA_KEYSTORE=$RUNNER_TEMP/monika.jks" >> "$GITHUB_ENV"
      - name: Build APK release
        env:
          MONIKA_KEYSTORE_PASSWORD: ${{ secrets.MONIKA_KEYSTORE_PASSWORD }}
          MONIKA_KEY_ALIAS: ${{ secrets.MONIKA_KEY_ALIAS }}
          MONIKA_KEY_PASSWORD: ${{ secrets.MONIKA_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease --console=plain
          # app-arm64-v8a-release.apk → AowVN-Monika-v0.2.0-arm64-v8a.apk (+ armeabi-v7a, universal)
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" -release.apk); abi=${abi#app-}
            cp "$f" "AowVN-Monika-${GITHUB_REF_NAME}-${abi}.apk"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: AowVN-Monika-*.apk
          generate_release_notes: true
      - name: Up APK lên Pixeldrain (nếu có secret PIXELDRAIN_API_KEY)
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          if [ -z "$PIXELDRAIN_API_KEY" ]; then echo "Bỏ qua: chưa có secret PIXELDRAIN_API_KEY"; exit 0; fi
          for f in AowVN-Monika-*.apk; do scripts/pixeldrain-upload.sh "$f"; done
