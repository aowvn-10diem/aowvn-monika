name: CodeQL (V41)
on:
  push:
    branches: [main]
    paths: ['app/**', 'cloudflare/**', '.github/workflows/codeql.yml', '.github/codeql-config.yml', 'gradle/libs.versions.toml']
  pull_request:
    paths: ['app/**', 'cloudflare/**', '.github/workflows/codeql.yml', '.github/codeql-config.yml', 'gradle/libs.versions.toml']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  security-events: write
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.language == 'java-kotlin'
      - name: Cài NDK cho build app
        if: matrix.language == 'java-kotlin'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;22.1.7171670' 'cmake;3.22.1' > /dev/null
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - name: Build Java/Kotlin để CodeQL thu đúng nguồn
        if: matrix.language == 'java-kotlin'
        run: ./gradlew clean assembleDebug --no-daemon --no-build-cache --console=plain
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
