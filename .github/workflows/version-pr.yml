name: Chuẩn bị PR phiên bản (V102)
on:
  pull_request:
    paths: ['scripts/version-pr.py', 'scripts/test-version-pr.py', '.github/workflows/version-pr.yml']
  push:
    paths: ['scripts/version-pr.py', 'scripts/test-version-pr.py', '.github/workflows/version-pr.yml']
  workflow_dispatch:
    inputs:
      next_version:
        description: 'Để trống thì tăng patch từ versionName trên main'
        required: false
        type: string
      create_pr:
        description: 'PM cho phép tạo PR nháp qua Environment bảo vệ; mặc định dry plan'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: version-pr-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 scripts/test-version-pr.py
  plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Xuất kế hoạch chỉ đọc từ main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          args=(--out version-pr-plan.json)
          if [ -n "$NEXT_VERSION" ]; then args+=(--next-version "$NEXT_VERSION"); fi
          python3 scripts/version-pr.py "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: version-pr-plan
          path: version-pr-plan.json
          retention-days: 3
  create:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.create_pr
    needs: plan
    # Chính sách Environment nằm ngoài ref dispatch; secret CHỈ đặt ở Environment này.
    environment: version-pr-main
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Kiểm Environment chỉ main và bắt buộc người duyệt độc lập
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: python3 scripts/version-pr.py --check-environment
      - name: Tạo duy nhất PR nháp từ nguồn main đã duyệt
        env:
          # Không dùng GITHUB_TOKEN ghi; Environment chặn cấp token cho ref khác main.
          GITHUB_TOKEN: ${{ secrets.VERSION_PR_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          args=(--apply --out version-pr-applied-plan.json)
          if [ -n "$NEXT_VERSION" ]; then args+=(--next-version "$NEXT_VERSION"); fi
          python3 scripts/version-pr.py "${args[@]}"
