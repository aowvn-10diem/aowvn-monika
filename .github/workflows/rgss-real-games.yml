name: R6 game thật (V25)
on:
  workflow_dispatch:
    inputs:
      rgss_tag:
        description: Release nháp RGSS đã duyệt
        default: engines-rgss-7
        required: true
      expect_fail:
        description: Case lỗi đã biết, bỏ từng case sau khi V44 sửa và PM kiểm
        default: vx
        required: false
  pull_request:
    paths:
      - .github/workflows/rgss-real-games.yml
      - scripts/ci-rgss-real.*
      - .maestro-rgss-real/**
permissions:
  contents: read
  actions: read
concurrency:
  group: v25-${{ github.ref }}
  cancel-in-progress: true
jobs:
  r6:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Artifact của Build RGSS run 7 trên main (92746a3), cùng binary gói draft7.
      # Không cần quyền ghi release; hết hạn artifact thì dừng, không rơi latest/draft.
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          artifact-ids: 11287384479
          run-id: 37161839408
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v25-engine
      - name: Kiểm snapshot RGSS7 bất biến trước khi dùng
        env:
          RGSS_TAG: ${{ inputs.rgss_tag || 'engines-rgss-7' }}
        run: |
          set -euo pipefail
          [ "$RGSS_TAG" = engines-rgss-7 ]
          cd "$RUNNER_TEMP/v25-engine"
          echo '83e23f835b98fdcb6921e542c538b0fd10d5589efa74ef922233431c5142f419  rgss-arm64-v8a.zip' | sha256sum --check --strict
          mv rgss-arm64-v8a.zip rgss.zip
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit trên config chuẩn
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" "cmake;3.22.1" > /dev/null
          sudo apt-get install -y python3-pil
          python3 scripts/test-rgss-real-verdict.py
          ./gradlew testDebugUnitTest --console=plain
          command -v 7z >/dev/null || sudo apt-get install -y p7zip-full
      - name: Chuẩn bị đúng ba nguồn G2 trong CI
        env:
          RGSS_TAG: ${{ inputs.rgss_tag || 'engines-rgss-7' }}
        run: python3 scripts/ci-rgss-real.py --scratch "$RUNNER_TEMP/v25" --report out/r6 --rgss-tag "$RGSS_TAG" --pack-file "$RUNNER_TEMP/v25-engine/rgss.zip"
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: '3.1'} # Cùng minor Ruby trong mkxp-z; không chạy script game.
      - name: V44 hình dạng cú pháp VX (không ghi nội dung game)
        id: vx_shape
        continue-on-error: true # Vẫn đo Ace/XP; cửa cuối giữ job đỏ nếu diagnostic thất bại.
        run: |
          python3 - "$RUNNER_TEMP/v25" <<'PY'
          import configparser,importlib.util,json,subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1]); cases=json.loads((root/'cases.json').read_text())
          case=next(c for c in cases if c['id']=='vx')
          if not case.get('prepared'): raise RuntimeError('VX không chuẩn bị được, không gọi chẩn đoán đạt')
          game=(root/case['localGameDir']).resolve()
          if not game.is_relative_to(root.resolve()): raise RuntimeError('Game dir vượt scratch')
          ini=configparser.ConfigParser(interpolation=None,strict=False)
          ini.read_string((game/'Game.ini').read_bytes().decode('utf-8-sig',errors='replace'))
          requested=ini.get('Game','Scripts',fallback='Data/Scripts.rvdata')
          spec=importlib.util.spec_from_file_location('arc','scripts/rgss_archive_script.py')
          arc=importlib.util.module_from_spec(spec);spec.loader.exec_module(arc)
          wanted=arc.relative_name(requested)
          files=[p for p in game.rglob('*') if p.is_file() and arc.relative_name(p.relative_to(game).as_posix())==wanted]
          if not files:
              archives=[p for p in game.iterdir() if p.suffix.lower() in ('.rgssad','.rgss2a','.rgss3a')]
              if len(archives)!=1: raise RuntimeError('Cần đúng một archive RGSS hoặc Scripts rời')
              scripts=root/'vx-scripts.rvdata' # Chỉ scratch, không artifact/filegame.
              scripts.write_bytes(arc.extract_script(archives[0],requested)); files=[scripts]
          if len(files)!=1: raise RuntimeError('Scripts trùng')
          with Path('out/r6/vx-script-shape.txt').open('w') as output:
              subprocess.run(['ruby','scripts/rgss-script-shape.rb',str(files[0])],stdout=output,check=True,timeout=60)
          with Path('out/r6/vx-ruby18-shape.txt').open('w') as output:
              subprocess.run(['ruby','scripts/rgss-script-shape.rb',str(files[0]),'10','--ruby18','--inspect=96:895','--inspect=96:915','--inspect=96:934','--inspect=96:951'],stdout=output,check=True,timeout=60)
          PY
      - name: Thu diagnostic đã che trước bài game dài (V44)
        if: steps.vx_shape.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: v44-vx-diagnostic
          path: |
            out/r6/vx-script-shape.txt
            out/r6/vx-ruby18-shape.txt
          if-no-files-found: error
          retention-days: 3
      - name: Build APK với config fixture (unit đã chạy trên config chuẩn)
        run: ./gradlew assembleDebug --console=plain
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash scripts/ci-rgss-real.sh "$RUNNER_TEMP/v25" out/r6 "$(if [ "$EVENT_NAME" = workflow_dispatch ]; then printf %s "$EXPECT_FAIL"; else printf %s vx; fi)"
        env:
          EXPECT_FAIL: ${{ inputs.expect_fail }}
          EVENT_NAME: ${{ github.event_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r6-api34-evidence
          # Chỉ nguồn/số đo/log/ảnh; không scratch, ZIP, thư mục game hay APK.
          path: out/r6/
          retention-days: 3
      - name: Diagnostic VX phải có bằng chứng
        if: ${{ always() && steps.vx_shape.outcome != 'success' }}
        run: |
          echo '::error::Diagnostic VX chưa đạt; kết quả runtime riêng vẫn được thu, không bỏ cửa kiểm'
          exit 1
