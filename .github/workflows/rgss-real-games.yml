name: R6 game thật (V25)
on:
  workflow_dispatch:
    inputs:
      rgss_tag:
        description: Release nháp RGSS đã duyệt
        default: engines-rgss-7
        required: true
  pull_request:
    paths:
      - .github/workflows/rgss-real-games.yml
      - scripts/ci-rgss-real.*
      - .maestro-rgss-real/**
permissions:
  # GET asset nháp đòi contents:write; không có bước phát hành.
  contents: write
concurrency:
  group: v25-${{ github.ref }}
  cancel-in-progress: true
jobs:
  r6:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
      - name: Chuẩn bị đúng ba nguồn G2 trong CI
        env:
          GH_TOKEN: ${{ github.token }}
          RGSS_TAG: ${{ inputs.rgss_tag || 'engines-rgss-7' }}
        run: python3 scripts/ci-rgss-real.py --scratch "$RUNNER_TEMP/v25" --report out/r6 --rgss-tag "$RGSS_TAG"
      - name: Build APK test
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" "cmake;3.22.1" > /dev/null
          ./gradlew testDebugUnitTest assembleDebug --console=plain
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash scripts/ci-rgss-real.sh "$RUNNER_TEMP/v25" out/r6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r6-api34-evidence
          # Chỉ nguồn/số đo/log/ảnh; không scratch, ZIP, thư mục game hay APK.
          path: out/r6/
          retention-days: 3
