name: Test Lab (máy thật trên cloud)

# Chạy tay: Actions → "Test Lab" → Run workflow.
# Build APK release (có R8) rồi cho robot của Firebase Test Lab tự bấm khắp app trên máy thật,
# bắt crash + chụp màn hình. Kết quả: link ở trang tóm tắt của lượt chạy + file tải về (Artifacts).
# Cần secret GCP_SA_KEY (JSON tài khoản dịch vụ) và GCP_PROJECT_ID — xem docs/TEST-LAB.md.
# Lưu ý: máy của Test Lab ở nước ngoài → aow.vn chặn (Cloudflare), phần đọc bài sẽ báo lỗi mạng; đó là bình thường.
on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Đúng một máy VIRTUAL model/version. Để trống = tự chọn một máy ảo, không dùng quota máy thật."
        required: false
        default: ""
      timeout:
        description: "Thời gian robot bấm thử mỗi máy"
        required: false
        default: "5m"

permissions: {contents: read, actions: read}
concurrency:
  group: testlab-budget
  cancel-in-progress: false

jobs:
  robo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Cửa exact Build (Robo chỉ máy ảo)
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 scripts/testlab-preflight.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Cài NDK cho J2ME Loader
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" "cmake;3.22.1" > /dev/null
      - name: Build APK release (R8, ký bằng khóa debug)
        run: ./gradlew assembleRelease --console=plain
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Chọn đúng một máy ảo
        id: dev
        env:
          DEVICES: ${{ inputs.devices }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud firebase test android models list --project "$GCP_PROJECT" --filter="form=VIRTUAL" --format=json > "$RUNNER_TEMP/virtual-models.json"
          python3 - <<'PY'
          import json, os, re
          models = json.load(open(os.environ['RUNNER_TEMP'] + '/virtual-models.json'))
          requested = os.environ['DEVICES'].strip()
          if requested:
              match = re.fullmatch(r'model=([A-Za-z0-9_-]+),version=(\d+)', requested)
              assert match, 'Đúng một model/version, không shell arguments'
              name, version = match.groups()
              model = next(m for m in models if m['id'] == name and m['form'] == 'VIRTUAL')
              assert version in model['supportedVersionIds'] and int(version) >= 26
          else:
              choices = [(int(v), m['id']) for m in models if m['form'] == 'VIRTUAL' for v in m['supportedVersionIds'] if int(v) >= 26]
              version, name = max(choices)
          args = 'model=%s,version=%s' % (name, version)
          print('VIRTUAL ' + args)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('device=' + args + '\n')
          PY
      - name: Chạy Robo máy ảo (không quota máy thật)
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          TIMEOUT: ${{ inputs.timeout }}
          DEVICE: ${{ steps.dev.outputs.device }}
        run: |
          set +e
          gcloud firebase test android run --project "$GCP_PROJECT" \
            --type robo \
            --app app/build/outputs/apk/release/app-universal-release.apk \
            --device "$DEVICE" --timeout "$TIMEOUT" \
            --results-dir "monika-${GITHUB_RUN_ID}" \
            --format=json > "$RUNNER_TEMP/robo-result.json" 2> "$RUNNER_TEMP/robo-error.txt"
          code=$?
          export RESULT_CODE="$code"
          mkdir -p testlab
          python3 - <<'PY'
          import json, os, re
          try:
              results = json.load(open(os.environ['RUNNER_TEMP'] + '/robo-result.json'))
          except (ValueError, OSError):
              results = []
          summary = {'exit_code': int(os.environ['RESULT_CODE']), 'results': []}
          if isinstance(results, list):
              for row in results:
                  axis, outcome = row.get('axis_value', ''), row.get('outcome', '')
                  if re.fullmatch(r'[A-Za-z0-9_-]{1,100}', axis) and outcome in ('Passed', 'Failed', 'Inconclusive', 'Skipped'):
                      summary['results'].append({'axis': axis, 'outcome': outcome})
          open('testlab/robo-summary.json', 'w').write(json.dumps(summary) + '\n')
          print(json.dumps(summary))
          PY
          exit "$code"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          retention-days: 3
          name: testlab-summary-only
          path: testlab/
          if-no-files-found: ignore
