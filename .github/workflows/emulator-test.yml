name: Emulator Test (máy ảo Android)

# Chạy tay: Actions → "Emulator Test" → Run workflow. Không tốn quota Claude.
# Build APK release (R8), cài lên máy ảo Android 11 và 14, chạy kịch bản Maestro (.maestro/*.yaml),
# rồi chơi thử GBA/GB/NES bằng ROM kiểm thử nhỏ (scripts/ci-emulator-games.sh), bắt crash trong logcat, đính kèm ảnh chụp + log. Repo private nên mỗi lượt tốn phút Actions (~10–15 phút/máy).
# Chưa phủ: Cách 3 (gỡ lỗi không dây) và HealthCheck trên máy tiết kiệm pin — cần máy thật.
on:
  workflow_dispatch:
    inputs:
      apis:
        description: "Bản Android, cách nhau bằng dấu phẩy"
        required: false
        default: "30,34"
      user_path_only:
        description: "V33: chỉ đường Thư viện → SAF → tải gói → mở → phím, API 34; không tạo release tạm"
        type: boolean
        required: false
        default: false
      rgss_tag:
        description: "Tag release (repo này) chứa rgss-arm64-v8a.zip để thử RPG Maker nhúng; để trống = bỏ qua ca RGSS"
        required: false
        default: ""

jobs:
  build:
    if: ${{ !inputs.user_path_only }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Cài NDK cho J2ME Loader
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" "cmake;3.22.1" > /dev/null
      - name: Build APK release (R8, ký khóa debug)
        run: |
          ./gradlew assembleRelease --console=plain
          python3 scripts/check-r8-mapping.py app/build/outputs/mapping/release/mapping.txt
      - uses: actions/upload-artifact@v7
        id: up_apk
        continue-on-error: true   # hạn mức lưu trữ Actions từng đầy: tải artifact lỗi không làm đỏ job
        with:
          name: apk
          path: app/build/outputs/apk/release/app-universal-release.apk
          retention-days: 3
      - name: Dự phòng - đưa APK qua release riêng tư khi hạn mức artifact đầy
        if: ${{ steps.up_apk.outcome != 'success' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "ci-apk-${{ github.run_id }}" app/build/outputs/apk/release/app-universal-release.apk \
            --prerelease --title "CI APK ${{ github.run_id }} (tự xóa được)" --notes "APK tạm cho Emulator Test"

  emulator:
    needs: build
    runs-on: ubuntu-latest
    # Release nháp (gói RGSS, luật V24) chỉ thấy được với quyền ghi contents.
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(format('[{0}]', inputs.apis || '30,34')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: dl_apk
        continue-on-error: true
        with: { name: apk }
      - name: Dự phòng - tải APK từ release tạm
        if: ${{ steps.dl_apk.outcome != 'success' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download "ci-apk-${{ github.run_id }}" -p 'app-universal-release.apk' -D .
      - name: Tải gói rgss thử từ release nháp (V24/G8)
        if: ${{ inputs.rgss_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RGSS_TAG: ${{ inputs.rgss_tag }}
        run: |
          set -euo pipefail
          # /releases/tags chỉ tìm bản đã phát hành; liệt kê có xác thực để thấy draft.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/rgss-releases.json"
          ASSET_ID=$(python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "rgss-releases.json")) as source:
              text = source.read().lstrip()
          decoder = json.JSONDecoder()
          all_releases = []
          while text:
              page, end = decoder.raw_decode(text)
              if not isinstance(page, list):
                  raise SystemExit("Phản hồi danh sách release không hợp lệ.")
              all_releases.extend(page)
              text = text[end:].lstrip()
          releases = [r for r in all_releases if r.get("tag_name") == os.environ["RGSS_TAG"] and r.get("draft") is True]
          if len(releases) != 1:
              raise SystemExit("Không tìm thấy duy nhất một release RGSS nháp; kiểm tag và quyền GITHUB_TOKEN.")
          assets = [a for a in releases[0].get("assets", []) if a.get("name") == "rgss-arm64-v8a.zip"]
          if len(assets) != 1 or type(assets[0].get("id")) is not int or assets[0]["id"] <= 0:
              raise SystemExit("Release RGSS nháp thiếu asset rgss-arm64-v8a.zip hợp lệ.")
          print(assets[0]["id"])
          PY
          )
          mkdir -p rgss-pack
          gh api "repos/$GH_REPO/releases/assets/$ASSET_ID" -H "Accept: application/octet-stream" > rgss-pack/rgss-arm64-v8a.zip
          unzip -tq rgss-pack/rgss-arm64-v8a.zip
          ls -l rgss-pack
      - name: Bật KVM (máy ảo chạy nhanh)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Cài Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Chạy trên máy ảo Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RGSS_PACK_ZIP: ${{ inputs.rgss_tag != '' && format('{0}/rgss-pack/rgss-arm64-v8a.zip', github.workspace) || '' }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: |
            mkdir -p out
            adb install -r app-universal-release.apk
            adb logcat -c
            maestro test .maestro --format junit --output out/maestro.xml --test-output-dir out/shots || echo FAILED > out/maestro.failed
            adb logcat -d > out/logcat.txt
            # Chơi thử từng hệ máy bằng ROM kiểm thử nhỏ (GBA, GB, NES): màn chờ phải gỡ, không crash.
            bash scripts/ci-emulator-games.sh out || echo FAILED > out/games.failed
            adb logcat -d > out/logcat-after-games.txt
            # Crash của app = lỗi, dù Maestro có báo xanh.
            if grep -E "FATAL EXCEPTION|AndroidRuntime.*com\.aow\.monika|IncompatibleClassChangeError" out/logcat.txt | head -20 > out/crash.txt && [ -s out/crash.txt ]; then echo CRASH > out/crash.flag; fi
      - uses: actions/upload-artifact@v7
        continue-on-error: true   # hạn mức lưu trữ Actions từng đầy: tải artifact lỗi không làm đỏ job
        if: always()
        with:
          name: ket-qua-api-${{ matrix.api }}
          path: out/
          retention-days: 7
      - name: Kết luận
        run: |
          if [ -f out/games.failed ]; then echo "::error::Có hệ máy không lên hình — xem games/summary.txt, games/*.png, games/*.logcat.txt"; cat out/games/summary.txt 2>/dev/null; exit 1; fi
          if [ -f out/maestro.failed ] || [ -f out/crash.flag ]; then echo "::error::Đỏ — xem crash.txt/logcat.txt trong Artifacts"; cat out/crash.txt 2>/dev/null; exit 1; fi
          echo "Xanh: mở app hai lần không crash trên API ${{ matrix.api }}."

  don-dep:
    needs: [build, emulator]
    if: ${{ always() && !inputs.user_path_only }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - name: Xóa release tạm ci-apk (V14)
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: gh release delete "ci-apk-${{ github.run_id }}" --yes --cleanup-tag || true

  user-path:
    if: ${{ inputs.user_path_only }}
    runs-on: ubuntu-latest
    # GitHub yêu cầu quyền ghi để đọc asset draft; job này chỉ dùng GET.
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Chuẩn bị game tự sinh và gói RGSS nháp (V33)
        env:
          GH_TOKEN: ${{ github.token }}
          RGSS_TAG: ${{ inputs.rgss_tag }}
        run: |
          test -n "$RGSS_TAG" || { echo "::error::V33 cần rgss_tag là bản nháp"; exit 1; }
          python3 scripts/ci-user-path.py prepare --out "$RUNNER_TEMP/v33-fixture" --rgss-tag "$RGSS_TAG"
      - name: Cài NDK và build APK test với config/TLS fixture
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" "cmake;3.22.1" > /dev/null
          ./gradlew testDebugUnitTest assembleDebug --console=plain
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Cài Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Đường người dùng API 34 (V33)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: |
            python3 scripts/ci-user-path.py serve --out "$RUNNER_TEMP/v33-fixture" > "$RUNNER_TEMP/v33-server.log" 2>&1 &
            bash scripts/ci-user-path.sh out/user-path "$RUNNER_TEMP/v33-fixture"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v33-user-path-api-34
          path: out/user-path/
          retention-days: 3
