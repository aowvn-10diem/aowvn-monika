name: Emulator Test (máy ảo Android)

# Chạy tay: Actions → "Emulator Test" → Run workflow. Không tốn quota Claude.
# Build APK release (R8), cài lên máy ảo Android 11 và 14, chạy kịch bản Maestro (.maestro/*.yaml),
# rồi chơi thử GBA/GB/NES bằng ROM kiểm thử nhỏ (scripts/ci-emulator-games.sh), bắt crash trong logcat, đính kèm ảnh chụp + log. Repo private nên mỗi lượt tốn phút Actions (~10–15 phút/máy).
# Chưa phủ: Cách 3 (gỡ lỗi không dây) và HealthCheck trên máy tiết kiệm pin — cần máy thật.
on:
  workflow_dispatch:
    inputs:
      apis:
        description: "Bản Android, cách nhau bằng dấu phẩy"
        required: false
        default: "30,34"
      rgss_tag:
        description: "Tag release (repo này) chứa rgss-arm64-v8a.zip để thử RPG Maker nhúng; để trống = bỏ qua ca RGSS"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Cài NDK cho J2ME Loader
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" "cmake;3.22.1" > /dev/null
      - name: Build APK release (R8, ký khóa debug)
        run: |
          ./gradlew assembleRelease --console=plain
          python3 scripts/check-r8-mapping.py app/build/outputs/mapping/release/mapping.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/app-universal-release.apk
          retention-days: 3

  emulator:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(format('[{0}]', inputs.apis || '30,34')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk }
      - name: Tải gói rgss thử (release riêng tư của repo này)
        if: ${{ inputs.rgss_tag != '' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p rgss-pack && gh release download "${{ inputs.rgss_tag }}" -p 'rgss-arm64-v8a.zip' -D rgss-pack
          ls -l rgss-pack
      - name: Bật KVM (máy ảo chạy nhanh)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Cài Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Chạy trên máy ảo Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RGSS_PACK_ZIP: ${{ inputs.rgss_tag != '' && format('{0}/rgss-pack/rgss-arm64-v8a.zip', github.workspace) || '' }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p out
            adb install -r app-universal-release.apk
            adb logcat -c
            maestro test .maestro --format junit --output out/maestro.xml --test-output-dir out/shots || echo FAILED > out/maestro.failed
            adb logcat -d > out/logcat.txt
            # Chơi thử từng hệ máy bằng ROM kiểm thử nhỏ (GBA, GB, NES): màn chờ phải gỡ, không crash.
            bash scripts/ci-emulator-games.sh out || echo FAILED > out/games.failed
            adb logcat -d > out/logcat-after-games.txt
            # Crash của app = lỗi, dù Maestro có báo xanh.
            if grep -E "FATAL EXCEPTION|AndroidRuntime.*com\.aow\.monika|IncompatibleClassChangeError" out/logcat.txt | head -20 > out/crash.txt && [ -s out/crash.txt ]; then echo CRASH > out/crash.flag; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ket-qua-api-${{ matrix.api }}
          path: out/
          retention-days: 7
      - name: Kết luận
        run: |
          if [ -f out/games.failed ]; then echo "::error::Có hệ máy không lên hình — xem games/summary.txt, games/*.png, games/*.logcat.txt"; cat out/games/summary.txt 2>/dev/null; exit 1; fi
          if [ -f out/maestro.failed ] || [ -f out/crash.flag ]; then echo "::error::Đỏ — xem crash.txt/logcat.txt trong Artifacts"; cat out/crash.txt 2>/dev/null; exit 1; fi
          echo "Xanh: mở app hai lần không crash trên API ${{ matrix.api }}."
