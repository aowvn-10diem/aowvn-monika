name: Build

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md"]   # commit chỉ sửa tài liệu không cần chạy Gradle (V11)
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Cài NDK cho J2ME Loader
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" "cmake;3.22.1" > /dev/null
      - name: Kiểm tra cấu hình + test
        run: ./gradlew testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anh-chup-giao-dien
          path: app/build/screenshots/
          if-no-files-found: ignore
          retention-days: 2   # hạn mức lưu trữ Actions từng đầy (14 GB artifact) → giữ ngắn
      - name: Build APK debug
        run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: AowVN-Monika-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1   # mỗi bản 83 MB; hạn mức lưu trữ Actions từng đầy
