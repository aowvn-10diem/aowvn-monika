name: Build

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md"]   # commit chỉ sửa tài liệu không cần chạy Gradle (V11)
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Chặn handler nuốt lỗi mới (V113, offline)
        env:
          DIAG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIAG_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DIAG_EVENT: ${{ github.event_name }}
        run: |
          python3 scripts/test-kiem-nuot-loi.py
          task_guard_args=(--base "$DIAG_BASE" --head "$DIAG_HEAD")
          if [[ "$DIAG_EVENT" == "pull_request" ]]; then
            task_guard_args+=(--pull-request)
          fi
          bash scripts/kiem-nuot-loi.sh "${task_guard_args[@]}"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with: {cache-provider: basic}
      - name: Cài NDK cho J2ME Loader
        run: bash scripts/ci-install-j2me-ndk.sh
      - name: Kiểm bản giả Win32API (Ruby)
        run: |
          ruby scripts/test-rgss-compat.rb
          ruby scripts/test-rgss-ruby18.rb
          ruby scripts/test-rgss-safe-marshal.rb
          ruby scripts/test-rgss-script-shape.rb
          ruby scripts/test-rgss-range-probe.rb
          python3 scripts/test-rgss-archive-script.py
      - name: Kiểm tra cấu hình + test
        run: ./gradlew testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v7
        continue-on-error: true   # hạn mức lưu trữ Actions từng đầy: tải artifact lỗi không làm đỏ job
        if: always()
        with:
          name: anh-chup-giao-dien
          path: app/build/screenshots/
          if-no-files-found: ignore
          retention-days: 2   # hạn mức lưu trữ Actions từng đầy (14 GB artifact) → giữ ngắn
      - name: Kiểm chính sách máy ảo (V71, không mạng/SDK)
        run: python3 scripts/test-ci-emulator-policy.py
      - name: Kiểm major action (V50)
        run: python3 scripts/test-workflow-action-majors.py
      - name: Kiểm cửa chặn release (V30, chỉ dữ liệu giả)
        run: python3 scripts/test-release-guards.py
      - name: Kiểm hợp đồng crash-worker (V29)
        run: node --test cloudflare/crash-worker/worker.test.js
      - name: Kiểm mapping và ký hiệu native (V20/D1)
        run: python3 scripts/test-crash-symbols.py --require-tools
      - name: Build APK debug
        run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v7
        continue-on-error: true   # hạn mức lưu trữ Actions từng đầy: tải artifact lỗi không làm đỏ job
        with:
          name: AowVN-Monika-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1   # mỗi bản 83 MB; hạn mức lưu trữ Actions từng đầy
