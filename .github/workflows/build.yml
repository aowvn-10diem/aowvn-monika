name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Cài NDK cho J2ME Loader
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" > /dev/null
      - name: Kiểm tra cấu hình + test
        run: ./gradlew testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anh-chup-giao-dien
          path: app/build/screenshots/
          if-no-files-found: ignore
      - name: Build APK debug
        run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: AowVN-Monika-debug
          path: app/build/outputs/apk/debug/*.apk
