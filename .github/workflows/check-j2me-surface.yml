name: J2ME manifest surface (V53)
on:
  pull_request:
    paths: [app/src/main/AndroidManifest.xml, scripts/check-j2me-manifest.py, .github/workflows/check-j2me-surface.yml]
permissions: {contents: read}
jobs:
  merged-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v6
        with: {cache-provider: basic}
      - name: Cài NDK cho J2ME Loader
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" "cmake;3.22.1" > /dev/null
      - name: Đo manifest đã merge trước và sau override
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p out/v53
          cp app/src/main/AndroidManifest.xml "$RUNNER_TEMP/v53-head.xml"
          trap 'cp "$RUNNER_TEMP/v53-head.xml" app/src/main/AndroidManifest.xml' EXIT
          git show "$BASE_SHA:app/src/main/AndroidManifest.xml" > app/src/main/AndroidManifest.xml
          ./gradlew :app:processDebugManifest --console=plain
          manifest=$(find app/build/intermediates/merged_manifests -path '*/debug/*/AndroidManifest.xml' -print -quit)
          test -n "$manifest"
          python3 scripts/check-j2me-manifest.py "$manifest" --phase before > out/v53/before.json
          cp "$RUNNER_TEMP/v53-head.xml" app/src/main/AndroidManifest.xml
          ./gradlew :app:processDebugManifest --console=plain
          python3 scripts/check-j2me-manifest.py "$manifest" --phase after > out/v53/after.json
          cat out/v53/before.json out/v53/after.json
      - uses: actions/upload-artifact@v7
        with: {name: v53-merged-manifest-metadata, path: out/v53/, retention-days: 3}
