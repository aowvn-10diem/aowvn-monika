name: J2ME manifest surface (V53)
on:
  pull_request:
    paths: [app/src/main/AndroidManifest.xml, app/src/github/AndroidManifest.xml, app/src/play/AndroidManifest.xml, scripts/check-j2me-manifest.py, scripts/test-j2me-manifest.py, .github/workflows/check-j2me-surface.yml]
permissions: {contents: read}
jobs:
  merged-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v6
        with: {cache-provider: basic}
      - name: Cài NDK cho J2ME Loader
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" "cmake;3.22.1" > /dev/null
      - name: Kiểm manifest đã merge của cả hai bản
        run: |
          set -euo pipefail
          python3 scripts/test-j2me-manifest.py
          mkdir -p out/v53
          ./gradlew :app:processGithubDebugManifest :app:processPlayDebugManifest --console=plain
          for variant in githubDebug playDebug; do
            manifest=$(find app/build/intermediates/merged_manifests -path "*/$variant/*/AndroidManifest.xml" -print -quit)
            test -n "$manifest"
            python3 scripts/check-j2me-manifest.py "$manifest" --phase after > "out/v53/$variant.json"
          done
          cat out/v53/githubDebug.json out/v53/playDebug.json
      - uses: actions/upload-artifact@v7
        with: {name: v53-merged-manifest-metadata, path: out/v53/, retention-days: 3}
