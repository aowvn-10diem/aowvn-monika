name: Engine signals (V22)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/engine-signals.yml
      - scripts/ci-engine-signals.*
      - app/src/main/java/vn/aow/monika/diag/Engine*
      - app/src/main/java/vn/aow/monika/runner/RgssGameActivity.kt
      - app/src/main/java/vn/aow/monika/runner/KirikiriGameActivity.kt
permissions: {contents: write} # GET asset draft RGSS; không publish.
concurrency: {group: 'v22-${{ github.ref }}', cancel-in-progress: true}
jobs:
  signals:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
      - name: Chỉ engine và fixtures tự sinh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 scripts/ci-engine-signals.py --scratch "$RUNNER_TEMP/v22" --rgss-tag engines-rgss-7
      - name: Unit và APK debug test
        run: |
          python3 scripts/test-crash-report-groups.py
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" "cmake;3.22.1" > /dev/null
          ./gradlew testDebugUnitTest assembleDebug --console=plain
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash scripts/ci-engine-signals.sh "$RUNNER_TEMP/v22" out/signals
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v22-signals-api34, path: out/signals/, retention-days: 3}
