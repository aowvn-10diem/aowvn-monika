name: Engine signals (V22)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/engine-signals.yml
      - scripts/ci-engine-signals.*
      - app/src/main/java/vn/aow/monika/diag/Engine*
      - app/src/main/java/vn/aow/monika/runner/RgssGameActivity.kt
      - app/src/main/java/vn/aow/monika/runner/KirikiriGameActivity.kt
permissions: {contents: read, actions: read}
concurrency: {group: 'v22-${{ github.ref }}', cancel-in-progress: true}
jobs:
  signals:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Artifact của Build RGSS run 7 trên main (92746a3), cùng binary gói draft7.
      # Không cần quyền ghi release; hết hạn artifact thì dừng, không rơi latest/draft.
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          artifact-ids: 11287384479
          run-id: 37161839408
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v22-engine
      - name: Kiểm snapshot RGSS7 bất biến trước khi dùng
        env:
          RGSS_TAG: engines-rgss-7
        run: |
          set -euo pipefail
          [ "$RGSS_TAG" = engines-rgss-7 ]
          cd "$RUNNER_TEMP/v22-engine"
          echo '83e23f835b98fdcb6921e542c538b0fd10d5589efa74ef922233431c5142f419  rgss-arm64-v8a.zip' | sha256sum --check --strict
          mv rgss-arm64-v8a.zip rgss.zip
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit trên config chuẩn
        run: |
          python3 scripts/test-crash-report-groups.py
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" "cmake;3.22.1" > /dev/null
          ./gradlew testDebugUnitTest --console=plain
      - name: Chỉ engine và fixtures tự sinh
        run: python3 scripts/ci-engine-signals.py --scratch "$RUNNER_TEMP/v22" --rgss-tag engines-rgss-7 --pack-file "$RUNNER_TEMP/v22-engine/rgss.zip"
      - name: APK debug với fixture (unit đã chạy trên config chuẩn)
        run: ./gradlew assembleDebug --console=plain
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash scripts/ci-engine-signals.sh "$RUNNER_TEMP/v22" out/signals
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v22-signals-api34, path: out/signals/, retention-days: 3}
