name: Sync config lên Cloudflare và trang web

# Mỗi lần config/monika-config.json đổi trên main:
#   1. Đẩy lên Cloudflare KV (app dự phòng khi GitHub Pages lỗi).
#   2. Đẩy config.json lên nhánh trang-web → GitHub Pages phục vụ https://monika.aow.vn/config.json.
# App đọc Pages trước, lỗi mạng/HTTP/JSON mới rơi về Worker.
# Cần secret CLOUDFLARE_API_TOKEN (Workers KV Storage — Edit). Phần Pages dùng github.token,
# không cần secret mới; workflow cần quyền contents: write để đẩy lên nhánh trang-web.
# workflow_dispatch luôn checkout refs/heads/main (không lấy config của nhánh được chọn) — dispatch
# từ nhánh nào cũng chỉ đồng bộ cấu hình main.
on:
  push:
    branches: [main]
    paths: ["config/monika-config.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'aowvn-10diem/aowvn-monika'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Luôn lấy config từ main, kể cả khi workflow_dispatch chọn nhánh khác.
          ref: main
          fetch-depth: 1
          # Không lưu token của checkout; phần Pages tự dùng ${{ github.token }} bên dưới.
          persist-credentials: false
      - name: Kiểm tra JSON
        run: python3 -c "import json;json.load(open('config/monika-config.json'))"
      - name: Đẩy lên KV
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: dd764b8dd4269d816e7c6a3cc119fece
          NAMESPACE_ID: f8c83723f0a44e95970a856383043447
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "::error::Thiếu secret CLOUDFLARE_API_TOKEN"; exit 1; fi
          curl -fsS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces/$NAMESPACE_ID/values/config.json" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: text/plain" \
            --data-binary @config/monika-config.json
      - name: Đẩy lên GitHub Pages (nhánh trang-web)
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BRANCH: trang-web
        run: |
          set -euo pipefail
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          # Dùng đúng token của workflow (permissions: contents: write), không cần secret mới.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          pages_git() { git -c "http.extraheader=AUTHORIZATION: basic $auth" "$@"; }

          pages="$(mktemp -d)"
          pages_git fetch --depth=1 origin "$PAGES_BRANCH:refs/remotes/origin/$PAGES_BRANCH"
          git worktree add --detach "$pages" "origin/$PAGES_BRANCH"

          for attempt in 1 2 3; do
            pages_git -C "$pages" fetch --depth=1 origin "$PAGES_BRANCH:refs/remotes/origin/$PAGES_BRANCH"
            git -C "$pages" reset --hard "origin/$PAGES_BRANCH"
            cp config/monika-config.json "$pages/config.json"
            git -C "$pages" add config.json
            if git -C "$pages" diff --cached --quiet; then
              echo "config.json trên $PAGES_BRANCH đã khớp — không cần đẩy."
              exit 0
            fi
            # [skip ci]: commit này chỉ là dữ liệu cho Pages, không chạy lại Build trên nhánh trang-web.
            # Mã commit là bản main đã checkout (không phải nhánh bấm workflow_dispatch).
            git -C "$pages" commit -m "config: đồng bộ từ main $(git rev-parse --short=8 HEAD) [skip ci]"
            if pages_git -C "$pages" push origin "HEAD:$PAGES_BRANCH"; then
              echo "Đã đẩy config.json lên $PAGES_BRANCH."
              exit 0
            fi
            echo "Push bị từ chối (lần đồng bộ khác vừa chạy) — thử lại lần $attempt."
            sleep 3
          done
          echo "::error::Không đẩy được config.json lên $PAGES_BRANCH sau 3 lần."
          exit 1
