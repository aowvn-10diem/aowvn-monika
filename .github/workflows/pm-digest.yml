name: PM digest (V39)
on:
  schedule: [{cron: '7,37 * * * *'}]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  actions: read
  security-events: read
concurrency:
  group: pm-digest
  cancel-in-progress: true
jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Kiểm L10 và wrapper, chuẩn bị bản tin PR không đăng bot
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: |
          python3 scripts/test-pm-digest.py
          python3 scripts/test-pm-digest-safe.py
          python3 scripts/test-pm-digest-rate-limit.py
          python3 scripts/pm-digest-safe.py --out out/preview
      - uses: actions/upload-artifact@v7
        with: {name: pm-digest-preview, path: out/preview/, retention-days: 3}
  digest:
    # PR chỉ preview một lần; không tạo digest thứ hai hoặc chạy token ghi trên code PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      actions: read
      security-events: read
    steps:
      # Luôn mã main: comment/fork/PR không được cấp code tùy ý chạy cùng token ghi.
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - name: Chuẩn bị và đăng root commit bot/trang-thai
        # PR đầu tiên chưa có wrapper trên main: chỉ preview ở job trên, không publish trước duyệt.
        if: hashFiles('scripts/pm-digest-safe.py') != ''
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: python3 scripts/pm-digest-safe.py --out "$RUNNER_TEMP/pm-digest" --publish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pm-digest-api-warning
          path: |
            ${{ runner.temp }}/pm-digest/warning.json
            ${{ runner.temp }}/pm-digest/warning.md
          retention-days: 1
          if-no-files-found: ignore
