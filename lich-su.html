<script>
// Hai nguồn tải song song ngay từ <head>:
//  1) docs/CHANGELOG.md trên main (nội dung tiếng Việt do nhóm viết, luôn là bản mới nhất)
//  2) Danh sách bản phát hành của GitHub (ngày, bản thử, lượt tải APK)
window.__lsMd = (function () {
  var urls = [
    "https://raw.githubusercontent.com/aowvn-10diem/aowvn-monika/main/docs/CHANGELOG.md",
    "https://cdn.jsdelivr.net/gh/aowvn-10diem/aowvn-monika@main/docs/CHANGELOG.md"
  ];
  function go(i) {
    if (i >= urls.length) return Promise.resolve(null);
    return fetch(urls[i]).then(function (r) { return r.ok ? r.text() : Promise.reject(); }).catch(function () { return go(i + 1); });
  }
  try { return go(0); } catch (e) { return Promise.resolve(null); }
})();
window.__lsRel = (function () {
  try {
    return fetch("https://api.github.com/repos/aowvn-10diem/aowvn-monika/releases?per_page=100", { headers: { Accept: "application/vnd.github+json" } })
      .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  } catch (e) { return Promise.resolve(null); }
})();
</script>

<script>
(function () {
  var REL_PAGE = "https://github.com/aowvn-10diem/aowvn-monika/releases";
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function num(n) { return Number(n).toLocaleString("vi-VN"); }
  function mb(b) { return (b / 1048576).toLocaleString("vi-VN", { maximumFractionDigits: 1 }) + " MB"; }
  function day(iso) { return new Date(iso).toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" }); }

  // Đổi một dòng markdown nhỏ gọn (đậm, mã, liên kết https) sang HTML an toàn
  function inline(t) {
    t = esc(t);
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    t = t.replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  }
  // Bỏ cụm "([abc1234](link), [#12](link))" dẫn tới commit/PR: dành cho người làm, không phải người dùng
  var REFS = /\s*\(\s*\[[^\]]*\]\([^)]*\)(?:\s*,\s*\[[^\]]*\]\([^)]*\))*\s*\)/g;

  // Người đọc là người dùng: chỉ giữ điều đã sửa và điều mới. Bỏ các câu ghi chú của nhóm như "chưa kiểm trên máy thật", "chưa rõ nguyên nhân".
  function userText(t) {
    var parts = t.match(/[^.;!?]+[.;!?]?\s*/g) || [t];
    var r = parts.filter(function (x) { return !/\bchưa (?:kiểm|rõ|chạy thật|thử)/i.test(x); }).join("").replace(/\s+/g, " ").replace(/\s+([.,;])/g, "$1").replace(/[;,]$/, ".").trim();
    return /^(\*\*[^*]+\*\*:?)?\s*$/.test(r) ? "" : r;
  }

  function parse(md) {
    var out = [], cur = null;
    md.split(/\r?\n/).forEach(function (l) {
      var h = l.match(/^##\s+(.*)$/);
      if (h) {
        var m = h[1].match(/v?(\d+\.\d+\.\d+)/);
        cur = m ? { tag: "v" + m[1], beta: /thử|pre-?release/i.test(h[1]), items: [] } : null;
        if (cur) out.push(cur);
        return;
      }
      if (!cur) return;
      var b = l.match(/^-\s+(.*)$/);
      if (!b) return;
      var t = b[1].replace(REFS, "").replace(/\s+([.,;])/g, "$1").trim();
      if (!t) return;
      if (/^Nội bộ/i.test(t)) return; // việc của nhóm làm: không đưa lên trang cho người dùng
      t = userText(t);
      if (t) cur.items.push(t);
    });
    // Sắp phiên bản mới nhất lên đầu, không phụ thuộc thứ tự trong file
    function key(v) { return v.tag.slice(1).split(".").map(Number); }
    out.sort(function (x, y) { var a = key(x), b = key(y); for (var i = 0; i < 3; i++) if (a[i] !== b[i]) return b[i] - a[i]; return 0; });
    return out;
  }

  function render(versions, rels) {
    var byTag = {}, total = 0, released = 0;
    (rels || []).forEach(function (r) {
      if (r.draft || !/^v\d/.test(r.tag_name)) return;
      var a = (r.assets || []).filter(function (x) { return /\.apk$/i.test(x.name); })[0];
      if (!a) return;
      byTag[r.tag_name] = { date: r.published_at, pre: !!r.prerelease, url: a.browser_download_url, size: a.size, dl: a.download_count || 0 };
      total += a.download_count || 0; released++;
    });
    if (rels && released) {
      document.getElementById("s-total").textContent = num(total);
      try { localStorage.setItem("monika.dl.v1", JSON.stringify({ n: total, t: Date.now() })); } catch (e) {}
      document.getElementById("s-count").textContent = num(released);
      document.getElementById("stats").hidden = false;
    }
    var html = "", first = true;
    versions.forEach(function (v) {
      var r = byTag[v.tag];
      if (rels && !r) return; // chưa có bản phát hành thật (ví dụ ứng viên) thì không đưa lên trang
      if (!v.items.length) return;
      var beta = r ? r.pre : v.beta;
      html += '<article class="rel"><header><h2>' + esc(v.tag) + "</h2>";
      if (first) html += '<span class="badge new">Mới nhất</span>';
      if (beta) html += '<span class="badge beta">Bản thử nghiệm</span>';
      if (r) {
        html += '<span class="meta"><span>' + esc(day(r.date)) + "</span><span>" + num(r.dl) + " lượt tải</span><span>" + esc(mb(r.size)) + "</span></span>";
      }
      html += "</header>";
      if (v.items.length) html += "<ul>" + v.items.map(function (t) { return "<li>" + inline(t) + "</li>"; }).join("") + "</ul>";
      if (r) html += '<a class="btn btn-small dlbtn" href="' + esc(r.url) + '">Tải bản ' + esc(v.tag) + "</a>";
      html += "</article>";
      first = false;
    });
    return html;
  }

  Promise.all([window.__lsMd, window.__lsRel]).then(function (res) {
    var list = document.getElementById("list");
    if (!res[0]) {
      list.innerHTML = '<p class="state">Chưa tải được nhật ký lúc này. Bạn xem tạm tại <a href="' + REL_PAGE + '">GitHub Releases</a> nhé.</p>';
      return;
    }
    var html = render(parse(res[0]), res[1]);
    list.innerHTML = html || '<p class="state">Chưa có mục nào để hiển thị.</p>';
  });
})();
</script>
