    <path d="M212 485q26-18 55 0t58-1q37-18 67 2v22H212z" fill="#FFFFFF" fill-opacity=".22"/>
    <path d="M333 448l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z" fill="#FFF3D1" fill-opacity=".9"/>
    <text x="224" y="530" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#181719">Tựa game 02</text>
    <text x="224" y="548" font-family="Manrope, Arial, sans-serif" font-size="10" fill="#737077">NDS · Chưa chơi</text>
  </g>
  <rect x="224" y="553" width="54" height="3" rx="1.5" fill="#E1E1DE"/>

  <g filter="url(#shadow)">
    <rect x="20" y="574" width="180" height="126" rx="20" fill="#FFFFFF"/>
    <rect x="20" y="574" width="180" height="72" rx="20" fill="url(#cool)"/>
    <circle cx="67" cy="602" r="18" fill="#FFFFFF" fill-opacity=".2"/>
    <path d="M58 603h18m-9-9v18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="32" y="668" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#181719">Tựa game 03</text>
    <text x="32" y="686" font-family="Manrope, Arial, sans-serif" font-size="10" fill="#737077">PSP · Đã chơi 1 giờ</text>
  </g>
  <rect x="32" y="691" width="54" height="3" rx="1.5" fill="#E1E1DE"/>

  <g filter="url(#shadow)">
    <rect x="212" y="574" width="180" height="126" rx="20" fill="#FFFFFF"/>
    <rect x="212" y="574" width="180" height="72" rx="20" fill="#66CFF3"/>
    <path d="M212 629q31-32 67-4t55-8q30-20 58 4v25H212z" fill="#FFFFFF" fill-opacity=".32"/>
    <circle cx="349" cy="594" r="9" fill="#FFF5D7"/>
    <text x="224" y="668" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#181719">Tựa game 04</text>
    <text x="224" y="686" font-family="Manrope, Arial, sans-serif" font-size="10" fill="#737077">SNES · Chưa chơi</text>
  </g>
  <rect x="224" y="691" width="54" height="3" rx="1.5" fill="#E1E1DE"/>

  <!-- Nhóm game đã dọn tách khỏi lưới chính -->
  <path d="M20 715h372" stroke="#E1E1DE" stroke-width="1"/>
  <text x="20" y="741" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#181719">Đã dọn</text>
  <text x="392" y="741" text-anchor="end" font-family="Manrope, Arial, sans-serif" font-size="11" fill="#737077">Save vẫn giữ · tải lại khi cần</text>
  <rect x="20" y="752" width="180" height="58" rx="17" fill="#F1F2EF"/>
  <rect x="30" y="762" width="38" height="38" rx="12" fill="#E1E1DE"/>
  <path d="M39 782a10 10 0 1 1 17-7M56 772v6h-6" fill="none" stroke="#737077" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="76" y="777" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#353337">Tựa game 05</text>
  <text x="76" y="794" font-family="Manrope, Arial, sans-serif" font-size="9" fill="#737077">Đã dọn · save còn</text>
  <rect x="20" y="752" width="180" height="58" rx="17" fill="none" stroke="#E1E1DE"/>

  <rect x="212" y="752" width="180" height="58" rx="17" fill="#F1F2EF"/>
  <rect x="222" y="762" width="38" height="38" rx="12" fill="#E1E1DE"/>
  <path d="M231 782a10 10 0 1 1 17-7M248 772v6h-6" fill="none" stroke="#737077" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="268" y="777" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#353337">Tựa game 06</text>
  <text x="268" y="794" font-family="Manrope, Arial, sans-serif" font-size="9" fill="#737077">Đã dọn · save còn</text>
  <rect x="212" y="752" width="180" height="58" rx="17" fill="none" stroke="#E1E1DE"/>

  <!-- Menu nổi theo FloatingDock -->
