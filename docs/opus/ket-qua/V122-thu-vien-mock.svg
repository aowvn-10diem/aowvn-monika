<svg xmlns="http://www.w3.org/2000/svg" width="412" height="915" viewBox="0 0 412 915" role="img" aria-labelledby="title desc">
  <title id="title">Mock V122 — bố cục Thư viện Aow Monika</title>
  <desc id="desc">Thư viện có trạng thái quét ngắn gọn, một hàng Tiếp tục chơi, lưới game đang có và nhóm Đã dọn riêng.</desc>
  <!-- Màu lấy từ LightColors, primaryGradient và FloatingDock trong ui/theme/Theme.kt. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB052"/>
      <stop offset=".5" stop-color="#FF7F78"/>
      <stop offset="1" stop-color="#E95CC8"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8076FF"/>
      <stop offset="1" stop-color="#628DF4"/>
    </linearGradient>
    <linearGradient id="art1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7665E8"/>
      <stop offset="1" stop-color="#4C8BEA"/>
    </linearGradient>
    <linearGradient id="art2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9E5E"/>
      <stop offset="1" stop-color="#E95CC8"/>
    </linearGradient>
    <linearGradient id="dock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A292D"/>
      <stop offset="1" stop-color="#1C1B1E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1E1818" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="412" height="915" fill="#F4F5F2"/>
  <!-- Thanh trạng thái -->
  <text x="24" y="25" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#181719">9:41</text>
  <g transform="translate(335 14)" fill="none" stroke="#181719" stroke-width="1.8" stroke-linecap="round">
    <path d="M0 8h3M6 6h3M12 3h3"/>
    <path d="M20 4c4-4 10-4 14 0M23 7c2-2 6-2 8 0M27 10h.1"/>
    <rect x="39" y="1" width="20" height="11" rx="3" stroke-width="1.4"/>
    <rect x="41" y="3" width="13" height="7" rx="1.5" fill="#181719" stroke="none"/>
    <path d="M60 4v5"/>
  </g>

  <!-- Header -->
  <text x="24" y="72" font-family="Manrope, Arial, sans-serif" font-size="23" font-weight="700" fill="#181719">Thư viện</text>
  <text x="24" y="96" font-family="Manrope, Arial, sans-serif" font-size="12" fill="#737077">6 game trong máy · 1 tài liệu</text>
  <circle cx="368" cy="70" r="23" fill="#FFFFFF" filter="url(#shadow)"/>
  <g transform="translate(358 60)" fill="#181719">
