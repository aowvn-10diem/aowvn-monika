  <text x="20" y="282" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#181719">Tiếp tục chơi</text>
  <text x="392" y="282" text-anchor="end" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#737077">GẦN ĐÂY</text>
