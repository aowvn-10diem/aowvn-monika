    <rect y="12" width="7" height="7" rx="2"/><rect x="12" y="12" width="7" height="7" rx="2"/>
  </g>

  <!-- Trạng thái quét: tách bộ đếm khỏi tiêu đề để không bị cắt -->
  <rect x="20" y="108" width="372" height="49" rx="17" fill="#FFFFFF"/>
  <circle cx="41" cy="132" r="8" fill="none" stroke="#FF806E" stroke-width="2"/>
  <path d="M47 138l5 5" stroke="#FF806E" stroke-width="2" stroke-linecap="round"/>
  <text x="60" y="137" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="600" fill="#181719">Đang quét máy</text>
  <text x="374" y="137" text-anchor="end" font-family="Manrope, Arial, sans-serif" font-size="12" fill="#737077">750 thư mục</text>
