# Kịch bản khói: mở app, đợi giao diện, chụp ảnh. Đợi thấy chữ "Duyệt theo hệ máy" (Trang chủ, đã thấy trên ảnh API 30) — màn tối trống thì test đỏ.
appId: com.aow.monika
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Duyệt theo hệ máy"
    timeout: 45000
- takeScreenshot: 01-mo-app
- pressKey: home
- launchApp
- extendedWaitUntil:
    visible: "Duyệt theo hệ máy"
    timeout: 45000
- takeScreenshot: 02-mo-lai
