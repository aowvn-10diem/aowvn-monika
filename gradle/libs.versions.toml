# Mọi phiên bản thư viện nằm ở đây. Nâng cấp = sửa 1 dòng.
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
splashscreen = "1.0.1"
browser = "1.8.0"
documentfile = "1.0.1"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
composeBom = "2024.12.01"
navigation = "2.8.5"
work = "2.10.0"
okhttp = "4.12.0"
serialization = "1.7.3"
coil = "2.7.0"
mlkit-ocr-gms = "19.0.1"
mlkit-ocr-gms-ja = "16.0.1"
webkit = "1.12.1"
junit = "4.13.2"
robolectric = "4.16.1"
coroutinesTest = "1.11.0" # cùng phiên bản cho test dispatcher và công cụ JVM kiểm gói
zip4j = "2.11.5" # giải nén .zip (mật khẩu ZipCrypto/AES), Java thuần
commonsCompress = "1.27.1" # chỉ dùng cho 7z có mật khẩu
xz = "1.10"
sevenZipAndroid = "Release-16.02-2.02" # 7-Zip native: RAR/RAR5 có mật khẩu
sevenZipJvm = "16.02-2.01" # chỉ để chạy test trên máy tính
arsclib = "1.3.5" # đọc/sửa AndroidManifest nhị phân của APK (Apache-2.0)
apksig = "8.7.3" # ký APK v1/v2/v3 (Apache-2.0, cùng bản với AGP)
libadb = "3.1.1" # gỡ lỗi không dây tự kết nối vào chính máy (Cách 3 của trình cài game); Apache-2.0
r8 = "8.7.18" # D8: biên dịch bộ nạp data thành .dex lúc build

[libraries]
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core = { module = "androidx.core:core", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-work = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
mlkit-ocr = { module = "com.google.android.gms:play-services-mlkit-text-recognition", version.ref = "mlkit-ocr-gms" }
mlkit-ocr-ja = { module = "com.google.android.gms:play-services-mlkit-text-recognition-japanese", version.ref = "mlkit-ocr-gms-ja" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "zip4j" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }
sevenzip-android = { module = "com.github.omicronapps:7-Zip-JBinding-4Android", version.ref = "sevenZipAndroid" }
sevenzip-jvm-natives = { module = "net.sf.sevenzipjbinding:sevenzipjbinding-all-platforms", version.ref = "sevenZipJvm" }
arsclib = { module = "io.github.reandroid:ARSCLib", version.ref = "arsclib" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
libadb = { module = "com.github.MuntashirAkon:libadb-android", version.ref = "libadb" }
r8 = { module = "com.android.tools:r8", version.ref = "r8" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutinesTest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
